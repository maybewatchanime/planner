<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Планер">
<meta name="theme-color" content="#eef1ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1311" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Планер</title>
<style>
/* Layout: one-screen app — header, scrolling content, floating "+" and bottom tab bar; sheets slide up from the bottom */
:root{
  --bg:#eef1ee; --surface:#ffffff; --ink:#16201b; --muted:#6a766f; --line:#dce2dd;
  --accent:#2f6f5e; --accent-ink:#ffffff; --danger:#c2412d;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,sans-serif;
  --spring:cubic-bezier(.32,.72,0,1);
  --ease:cubic-bezier(.2,.8,.2,1);
  --shadow:rgba(10,20,15,.14);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1311; --surface:#1a201d; --ink:#e7ece8; --muted:#8c9790; --line:#29312d;
    --accent:#5fb39a; --accent-ink:#0f1311; --danger:#ef6a55; --shadow:rgba(0,0,0,.45); color-scheme:dark; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--font);-webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{opacity:.55}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

#app{display:flex;flex-direction:column;height:100%;overflow:hidden}
.top{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 8px;position:relative;z-index:4;background:var(--bg)}
.top h1{flex:1;margin:0;font:700 30px/1.15 var(--round);letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#back{font-size:34px;line-height:1;color:var(--accent);padding:0 8px 6px 0}
#action{color:var(--accent);font-weight:600;font-size:15px;padding:8px 0 8px 8px;flex:none}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px calc(env(safe-area-inset-bottom,0px) + 150px);position:relative;z-index:2;background:var(--bg)}

/* page transitions */
.ghost{position:fixed;left:0;right:0;overflow:hidden;padding:4px 16px 0;background:var(--bg);pointer-events:none}
.ghost.push{z-index:1;animation:pushOut .44s var(--spring) forwards}
.ghost.pop{z-index:3;animation:popOut .44s var(--spring) forwards;box-shadow:-14px 0 30px var(--shadow)}
.ghost.fade{z-index:3;animation:fadeOut .2s ease-out forwards}
main.in-push{animation:pushIn .44s var(--spring);box-shadow:-14px 0 30px var(--shadow)}
main.in-pop{animation:popIn .44s var(--spring)}
main.in-fade{animation:fadeIn .32s var(--ease)}
@keyframes pushIn{from{transform:translateX(100%)}}
@keyframes pushOut{to{transform:translateX(-28%);opacity:.5}}
@keyframes popIn{from{transform:translateX(-28%);opacity:.5}}
@keyframes popOut{to{transform:translateX(100%)}}
@keyframes fadeOut{to{opacity:0}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}

.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;z-index:5;
  background:color-mix(in srgb,var(--surface) 86%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  border-top:1px solid var(--line);padding:6px 16px calc(env(safe-area-inset-bottom,0px) + 6px)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:4px;transition:color .2s}
.tabs button.on{color:var(--accent)}
.tabs svg{width:26px;height:26px;transition:transform .35s var(--spring)}
.tabs button:active svg{transform:scale(.82)}
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 76px);z-index:6;width:58px;height:58px;border-radius:50%;
  background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 22px var(--shadow);transition:transform .3s var(--spring)}
.fab:active{transform:scale(.88)}
.fab svg{width:28px;height:28px}

/* Calendar */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px 10px 10px}
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 10px 8px}
.cal-head b{font:650 19px var(--round)}
.nav{display:flex;gap:2px;align-items:center}
.nav button{min-width:36px;height:36px;border-radius:10px;color:var(--accent);font-size:22px;line-height:1;transition:background .2s}
.nav button:active{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.nav .tod{font-size:14px;font-weight:600;padding:0 10px}
.gridwrap{overflow:hidden}
.wd,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd span{text-align:center;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding-bottom:4px}
.wd span:nth-child(n+6){color:var(--danger);opacity:.8}
.day{aspect-ratio:1/1.08;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-size:16px;font-variant-numeric:tabular-nums;position:relative;transition:background .25s,color .25s,transform .3s var(--spring)}
.day:active{transform:scale(.9)}
.day span{line-height:1}
.day.out{opacity:.38}
.day.has{background:color-mix(in srgb,var(--c) 20%,transparent);font-weight:600}
.day.today span{color:var(--accent);font-weight:800}
.day.sel{background:var(--accent);color:var(--accent-ink)}
.day.sel.today span{color:inherit}
.day b{display:flex;gap:3px;height:5px}
.day b i{width:5px;height:5px;border-radius:50%}
.day.sel b i{box-shadow:0 0 0 1.5px var(--accent-ink)}
.day.late::after{content:"";position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--danger)}

.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:22px 4px 8px}
.sechead h2{margin:0;font:650 18px var(--round)}
.sechead small{color:var(--muted);font-size:13px;white-space:nowrap}
.sub{font-size:12px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:20px 4px 8px}
.sub.warn{color:var(--danger)}

/* Lists */
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.item,.frow{transition:background .2s}
.item:active,.frow:active{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.list>li:first-child{border-radius:15px 15px 0 0}
.list>li:last-child{border-radius:0 0 15px 15px;border-bottom:0}
.list>li:only-child{border-radius:15px}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line);position:relative;background:var(--surface)}
.check{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;transition:background .2s,border-color .2s}
.item.done .check{background:var(--accent);border-color:var(--accent)}
.item.done .check::after{content:"";width:10px;height:5px;border-left:2px solid var(--accent-ink);border-bottom:2px solid var(--accent-ink);transform:translateY(-1px) rotate(-45deg)}
.check.just{animation:pop .35s var(--spring)}
.item .t{transition:color .25s}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.noteic{flex:none;width:24px;height:24px;color:var(--muted)}
.txt{flex:1;min-width:0}
.t{font-weight:550;overflow-wrap:anywhere}
.b{color:var(--muted);font-size:14px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;white-space:pre-line}
.meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:4px}
.meta:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:4px}
.chip i{width:8px;height:8px;border-radius:50%}
.chip svg{width:14px;height:14px}
.meta .late{color:var(--danger);font-weight:650}
.rthumb{flex:none;width:46px;height:46px;border-radius:10px;object-fit:cover;background:var(--line)}
.empty{color:var(--muted);text-align:center;padding:22px 16px;border:1.5px dashed var(--line);border-radius:16px;font-size:15px}

.frow{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line)}
.fic{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff}
.fic svg{width:22px;height:22px}
.frow .m{font-size:13px;color:var(--muted)}
.arr{color:var(--muted);font-size:24px;line-height:1}
.ghostbtn{margin-top:12px;width:100%;padding:14px;border-radius:14px;color:var(--accent);font-weight:600;border:1.5px dashed var(--line)}

.seg{display:flex;background:color-mix(in srgb,var(--ink) 8%,transparent);border-radius:11px;padding:3px;margin-bottom:6px;position:relative}
.seg button{flex:1;padding:7px 4px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted);position:relative;z-index:1;transition:color .25s}
.seg button.on{color:var(--ink)}
.seg .pill{position:absolute;top:3px;bottom:3px;left:3px;border-radius:9px;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.14);transition:transform .38s var(--spring),width .38s var(--spring)}

/* Sheet */
.sheet-wrap{position:fixed;inset:0;background:rgba(0,0,0,0);display:flex;align-items:flex-end;z-index:20;transition:background .32s ease}
.sheet-wrap.open{background:rgba(0,0,0,.38)}
.sheet{width:100%;max-height:94%;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;
  padding:6px 16px calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateY(105%);transition:transform .46s var(--spring);will-change:transform}
.sheet-wrap.open .sheet{transform:none}
.grab{width:100%;height:18px;display:grid;place-items:center;touch-action:none}
.grab::before{content:"";width:38px;height:5px;border-radius:3px;background:var(--line)}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:4px 0 14px;touch-action:none}
.sh-head b{font-weight:650}
.link{color:var(--accent);font-size:16px;padding:6px 0}
.link.strong{font-weight:700}
.inp{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;-webkit-appearance:none;appearance:none;transition:border-color .2s}
.inp:focus{border-color:var(--accent)}
#fTitle{font-weight:600;font-size:18px}
textarea.inp{min-height:110px;resize:vertical;margin-top:10px;line-height:1.45;transition:min-height .35s var(--spring),border-color .2s}
textarea.inp.big{min-height:34vh}
.field{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 10px 4px 14px;margin-top:10px;min-height:50px}
.field>span{color:var(--muted);flex:none;width:58px}
.field input,.field select{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);border:0;background:none;padding:10px 0;outline:none}
.field .link{font-size:14px;flex:none}
.danger{width:100%;margin-top:22px;padding:14px;border-radius:12px;background:color-mix(in srgb,var(--danger) 13%,transparent);color:var(--danger);font-weight:650}
.swatches{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;padding:4px}
.swatches button{width:36px;height:36px;border-radius:50%;transition:box-shadow .2s,transform .3s var(--spring)}
.swatches button:active{transform:scale(.85)}
.swatches button.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
.btn{display:block;width:100%;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:600;margin-top:10px;text-align:left}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);text-align:center}
.note{color:var(--muted);font-size:14px;margin:14px 4px 0;line-height:1.45}

/* Attachments */
.atlabel{display:flex;justify-content:space-between;align-items:baseline;margin:18px 4px 0;font-size:12px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.atbar{display:flex;gap:8px;margin-top:8px}
.atbar button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 6px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--accent);transition:transform .3s var(--spring)}
.atbar button:active{transform:scale(.95)}
.atbar svg{width:20px;height:20px}
.rec{display:flex;align-items:center;gap:12px;margin-top:8px;padding:8px 14px;border-radius:12px;background:color-mix(in srgb,var(--danger) 12%,transparent);min-height:46px}
.rec i{width:10px;height:10px;border-radius:50%;background:var(--danger);animation:blink 1.1s ease-in-out infinite}
.rec b{flex:1;font-variant-numeric:tabular-nums;color:var(--danger)}
@keyframes blink{50%{opacity:.25}}
.atts{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;margin-top:10px}
.atts:empty{display:none}
.tile{position:relative;aspect-ratio:1;border-radius:12px;background:var(--surface);border:1px solid var(--line);overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;cursor:pointer;animation:tileIn .36s var(--spring)}
@keyframes tileIn{from{transform:scale(.7);opacity:0}}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .tic{width:28px;height:28px;color:var(--accent)}
.tile .tic svg{width:100%;height:100%}
.tile .ext{font:700 14px var(--round);color:var(--accent);text-transform:uppercase}
.tile .nm{font-size:10.5px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .play{position:absolute;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;display:grid;place-items:center}
.tile .play svg{width:14px;height:14px;margin-left:2px}
.tile .dur{position:absolute;left:5px;bottom:5px;font-size:10.5px;font-weight:650;color:#fff;background:rgba(0,0,0,.55);padding:1px 5px;border-radius:6px;font-variant-numeric:tabular-nums}
.tile.k-audio .dur{position:static;background:none;color:var(--muted);padding:0}
.tile .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;font-size:16px;line-height:1;z-index:2}
.tile.busy::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
.tile.busy>*{opacity:.35}
@keyframes spin{to{transform:rotate(360deg)}}

/* Viewer */
.viewer{position:fixed;inset:0;z-index:40;background:#000;color:#fff;display:flex;flex-direction:column;opacity:0;transition:opacity .25s ease}
.viewer.open{opacity:1}
.viewer .track{transform:scale(.94);transition:transform .38s var(--spring)}
.viewer.open .track{transform:none}
.vbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 6px) 12px 6px}
.vbar button{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.12)}
.vbar svg{width:22px;height:22px}
#vCount{font-size:14px;font-weight:600;opacity:.8;font-variant-numeric:tabular-nums}
.track{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;min-height:0}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:6px;min-width:0}
.slide img,.slide video{max-width:100%;max-height:100%;object-fit:contain;display:block}
.slide.zoom{overflow:auto;align-items:flex-start;justify-content:flex-start}
.slide.zoom img{max-width:none;max-height:none;width:240%}
.fcard{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:24px;max-width:340px;width:100%}
.fcard .big{width:64px;height:64px;color:#9fd8c6}
.fcard .big svg{width:100%;height:100%}
.fcard .bigext{font:800 30px var(--round);color:#9fd8c6;text-transform:uppercase;border:2px solid currentColor;border-radius:16px;padding:18px 16px;min-width:96px}
.fcard b{overflow-wrap:anywhere}
.fcard small{opacity:.65}
.fcard audio{width:100%}
.vbtn{margin-top:6px;padding:12px 18px;border-radius:12px;background:#fff;color:#000;font-weight:650}
.vname{padding:8px 16px calc(env(safe-area-inset-bottom,0px) + 14px);text-align:center;font-size:13px;opacity:.7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;max-width:calc(100% - 32px);text-align:center;pointer-events:none;transition:transform .4s var(--spring),opacity .25s}
.toast.show{transform:translate(-50%,0);opacity:1}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <button id="back" aria-label="Назад" hidden>‹</button>
    <h1 id="title">Календарь</h1>
    <button id="action"></button>
  </header>
  <main id="view"></main>
  <button class="fab" id="fab" aria-label="Добавить"></button>
  <nav class="tabs">
    <button data-tab="cal"></button>
    <button data-tab="folders"></button>
  </nav>
</div>
<div class="sheet-wrap" id="sheetWrap" hidden><div class="sheet" id="sheet"></div></div>
<div class="viewer" id="viewer" hidden></div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const KEY = 'planner.v1';
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SPRING = 'cubic-bezier(.32,.72,0,1)';
const COLORS = ['#2f6f5e','#3a6fd6','#c2412d','#d4891f','#8a52c9','#d24f8a','#4f8f3a','#6a766f'];
const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_G = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONTHS_S = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const WD = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const WDL = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const sv = (p, w=1.8) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICON = {
  cal: sv('<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>'),
  folder: sv('<path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2.5h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/>'),
  note: sv('<path d="M6 3.5h8l4 4v13H6z"/><path d="M14 3.5v4h4M9 12.5h6M9 16h4"/>'),
  plus: sv('<path d="M12 5v14M5 12h14"/>', 2.4),
  image: sv('<rect x="3.5" y="4.5" width="17" height="15" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="m4 17 4.5-4.5 3.5 3.5 2.5-2.5 5.5 5"/>'),
  file: sv('<path d="M14 3.5H7a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8.5z"/><path d="M14 3.5v5h5"/>'),
  mic: sv('<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>'),
  wave: sv('<path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"/>'),

const pad = n => String(n).padStart(2,'0');

function fmtSize(b){ if(!b) return '0 КБ'; const u=['Б','КБ','МБ','ГБ']; let i=0; while(b>=1024&&i<3){b/=1024;i++;} return (b<10&&i?b.toFixed(1):Math.round(b))+' '+u[i]; }

const extOf = name => (String(name).match(/\.([a-z0-9]{1,5})$/i)||[])[1]?.toLowerCase() || '';
const TYPES = {jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',gif:'image/gif',webp:'image/webp',heic:'image/heic',mp4:'video/mp4',mov:'video/quicktime',m4v:'video/mp4',
  mp3:'audio/mpeg',m4a:'audio/mp4',wav:'audio/wav',aac:'audio/aac',ogg:'audio/ogg',webm:'audio/webm',pdf:'application/pdf'};

/* ---------- storage: IndexedDB for data + files, localStorage as fallback ---------- */
let _idb;
function idb(){
  return _idb ||= new Promise((res, rej) => {
    const r = indexedDB.open('planner', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('files'); r.result.createObjectStore('kv'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function tx(store, mode, fn){
  const d = await idb();
  return new Promise((res, rej) => {
    const t = d.transaction(store, mode); let out;
    const r = fn(t.objectStore(store)); if (r) r.onsuccess = () => { out = r.result; };
    t.oncomplete = () => res(out); t.onerror = t.onabort = () => rej(t.error);
  });
}
const fput = (id, b) => tx('files','readwrite', s => s.put(b, id));
const fget = id => tx('files','readonly', s => s.get(id));
const fdel = ids => ids.length ? tx('files','readwrite', s => { ids.forEach(i => s.delete(i)); }) : Promise.resolve();
const fkeys = () => tx('files','readonly', s => s.getAllKeys());
const fclear = () => tx('files','readwrite', s => s.clear());
const kvGet = k => tx('kv','readonly', s => s.get(k));
const kvPut = (k, v) => tx('kv','readwrite', s => s.put(v, k));
async function storeBlob(id, f){
  try { await fput(id, f); }
  catch(e){ await fput(id, new Blob([await f.arrayBuffer()], {type: f.type})); }
}

function cleanAtt(a){
  return { id:String(a.id), name:String(a.name||'Файл'), type:String(a.type||''), size:Number(a.size)||0,
    thumb: typeof a.thumb==='string' && a.thumb.startsWith('data:image/') ? a.thumb : null, dur:Number(a.dur)||0 };
}
function sanitize(d){
  if (!d || !Array.isArray(d.folders) || !Array.isArray(d.items)) return null;
  const folders = d.folders.filter(f=>f&&f.id).map(f=>({id:String(f.id),name:String(f.name||'Папка'),color:okColor(f.color)}));
  if (!folders.length) return null;
  const ids = new Set(folders.map(f=>f.id));
  const items = d.items.filter(x=>x&&x.id&&ids.has(String(x.folderId))).map(x=>({id:String(x.id),folderId:String(x.folderId),type:x.type==='note'?'note':'task',
    title:String(x.title||''),body:String(x.body||''),date:okDate(x.date),done:!!x.done,updated:Number(x.updated)||Date.now(),
    atts:Array.isArray(x.atts)?x.atts.filter(a=>a&&a.id).map(cleanAtt):[]}));
  return { folders, items, saved:Number(d.saved)||0 };
}
function seed(){
  const s = uid(), p = uid();
  return { folders:[{id:s,name:'Учёба',color:COLORS[1]},{id:p,name:'Личное',color:COLORS[0]}],
    items:[{id:uid(),folderId:p,type:'note',title:'Как пользоваться',
      body:'Внизу две вкладки: «Календарь» и «Папки».\nКнопка + создаёт задачу или заметку. Если указать дату, день подсветится в календаре цветом папки.\nК любой записи можно прикрепить фото, видео, файлы и голосовые.\nРезервная копия: «Ещё» вверху справа.\n\nЭту заметку можно удалить.',
      date:null,done:false,updated:Date.now(),atts:[]}], saved:0 };
}

let db = { folders:[], items:[] };
let saveChain = Promise.resolve();
function save(){
  db.saved = Date.now();
  const full = JSON.stringify(db);
  saveChain = saveChain.then(() => kvPut('db', full)).catch(() => {});
  try {
    const lite = {...db, items: db.items.map(x => x.atts.length ? {...x, atts: x.atts.map(a => ({...a, thumb:null}))} : x)};
    localStorage.setItem(KEY, JSON.stringify(lite));
  } catch(e){}
}
async function loadDb(){
  let a = null, b = null;
  try { const s = await kvGet('db'); if (s) a = sanitize(JSON.parse(s)); } catch(e){}
  try { b = sanitize(JSON.parse(localStorage.getItem(KEY))); } catch(e){}
  if (a && (!b || a.saved >= b.saved)) return a;
  if (b){
    if (a){ const th = new Map(); a.items.forEach(x => x.atts.forEach(t => t.thumb && th.set(t.id, t.thumb))); b.items.forEach(x => x.atts.forEach(t => { t.thumb ||= th.get(t.id) || null; })); }
    return b;
  }
  return seed();
}
async function cleanupFiles(){
  try {
    const used = new Set(); db.items.forEach(x => x.atts.forEach(a => used.add(a.id)));
    const keys = await fkeys(); await fdel(keys.filter(k => !used.has(k)));
  } catch(e){}
}

function ensureFolder(){ if (!db.folders.length){ db.folders.push({id:uid(),name:'Общее',color:COLORS[0]}); save(); } return db.folders[0].id; }
const isLate = x => x.type==='task' && !x.done && x.date && x.date < today();
function sortItems(list){
  return list.slice().sort((a,b)=>{
    if (a.type!==b.type) return a.type==='task' ? -1 : 1;
    if (a.type==='task'){
      if (a.done!==b.done) return a.done ? 1 : -1;
      if ((a.date||'9')!==(b.date||'9')) return (a.date||'9') < (b.date||'9') ? -1 : 1;
    }
    return (b.updated||0)-(a.updated||0);
  });

  document.querySelectorAll('.ghost').forEach(g => g.remove());
  const r = view.getBoundingClientRect();
  const g = document.createElement('div'); g.className = 'ghost '+kind;

  inner.querySelectorAll('[id]').forEach(e => e.removeAttribute('id'));

  view.classList.remove('in-push','in-pop','in-fade'); void view.offsetWidth; view.classList.add('in-'+kind);
  g.addEventListener('animationend', () => g.remove(), {once:true});

}

function flip(fn){
  const before = new Map();
  view.querySelectorAll('[data-id]').forEach(el => before.set(el.dataset.id, el.getBoundingClientRect()));
  fn();
  if (REDUCE) return;
  view.querySelectorAll('[data-id]').forEach(el => {
    const b = before.get(el.dataset.id), a = el.getBoundingClientRect();
    if (!b){ el.animate([{opacity:0,transform:'scale(.96)'},{opacity:1,transform:'none'}], {duration:300,easing:'ease-out'}); return; }

    if (Math.abs(dx)<1 && Math.abs(dy)<1) return;
    el.style.zIndex = 1;
    el.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}], {duration:420,easing:SPRING}).onfinish = () => { el.style.zIndex = ''; };
  });
}

function byDateMap(){ const m = {}; db.items.forEach(x => { if (x.date) (m[x.date] ||= []).push(x); }); return m; }
function gridCells(){
  const y = st.month.getFullYear(), mo = st.month.getMonth(), t = today();
  const shift = (new Date(y,mo,1).getDay()+6)%7, dim = new Date(y,mo+1,0).getDate();
  const n = Math.ceil((shift+dim)/7)*7, byDate = byDateMap();
  let cells = '';
  for (let i=0;i<n;i++){
    const d = new Date(y,mo,1-shift+i), k = ymd(d), its = byDate[k] || [];
    const open = its.filter(x => !(x.type==='task' && x.done));
    const cls = ['day'];
    if (d.getMonth()!==mo) cls.push('out');
    if (k===t) cls.push('today');
    if (k===st.sel) cls.push('sel');
    if (open.length) cls.push('has');
    if (its.some(isLate)) cls.push('late');
    const colors = [...new Set(open.map(x=>okColor(fcolor(x.folderId))))];
    cells += `<button class="${cls.join(' ')}" data-date="${k}" style="--c:${colors[0]||'transparent'}" aria-label="${dayTitle(k)}${its.length?', дел: '+its.length:''}"><span>${d.getDate()}</span><b>${colors.slice(0,3).map(c=>`<i style="background:${c}"></i>`).join('')}</b></button>`;
  }
  return cells;
}
function dayPane(){
  const t = today(), dayItems = byDateMap()[st.sel] || [];

  const nOpen = dayItems.filter(x=>!(x.type==='task'&&x.done)).length;

(() => { // drag the sheet down by its handle or header to close it

/* ---------- attachments ---------- */
function drawThumb(src, w, h){
  const s = Math.min(1, 280/Math.max(w,h)), c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w*s)); c.height = Math.max(1, Math.round(h*s));
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', .72);
}
async function imageThumb(blob){

  try { const img = new Image(); img.src = url; await img.decode(); return { thumb: drawThumb(img, img.naturalWidth, img.naturalHeight) }; }
  catch(e){ return {}; } finally { URL.revokeObjectURL(url); }
}
function mediaInfo(blob, isVideo){
  return new Promise(res => {
    const m = document.createElement(isVideo ? 'video' : 'audio'), url = URL.createObjectURL(blob);
    let done = false;
    const fin = r => { if (done) return; done = true; URL.revokeObjectURL(url); m.removeAttribute('src'); m.load?.(); res(r); };
    m.muted = true; m.preload = 'auto'; if (isVideo){ m.playsInline = true; m.setAttribute('playsinline',''); }
    const dur = () => isFinite(m.duration) ? m.duration : 0;
    m.onloadedmetadata = () => { if (!isVideo) fin({dur:dur()}); };
    m.onloadeddata = () => { if (isVideo) m.currentTime = Math.min(.4, dur()/2 || .1); };
    m.onseeked = () => { try { fin({thumb: drawThumb(m, m.videoWidth, m.videoHeight), dur: dur()}); } catch(e){ fin({dur:dur()}); } };

}
function makeInfo(f, type){

  i.style.cssText = 'position:fixed;left:-100px;top:0;opacity:0';

function tileHTML(a){

const canRec = !!(window.MediaRecorder && navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
async function startRec(onDone){
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ toast('Нет доступа к микрофону. Разрешите его, когда iPhone спросит'); return null; }
  const mime = ['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(t => MediaRecorder.isTypeSupported?.(t)) || '';
  const mr = new MediaRecorder(stream, mime ? {mimeType:mime} : undefined), chunks = [], t0 = Date.now();
  let cancelled = false;
  mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  mr.onstop = () => {
    stream.getTracks().forEach(t => t.stop());
    if (cancelled || !chunks.length) return;
    const type = (mr.mimeType || mime || 'audio/mp4').split(';')[0], d = new Date();
    onDone(new File(chunks, `Голосовая ${pad(d.getHours())}-${pad(d.getMinutes())}.${type.includes('webm')?'webm':'m4a'}`, {type}), (Date.now()-t0)/1000);
  };
  mr.start(250);
  return { t0, stop: () => { if (mr.state!=='inactive') mr.stop(); },
    cancel: () => { cancelled = true; if (mr.state!=='inactive') mr.stop(); else stream.getTracks().forEach(t => t.stop()); } };
}

let vs = null;
async function openViewer(atts, start=0){
  if (!atts.length) return;
  const vw = $('#viewer');
  const blobs = await Promise.all(atts.map(a => fget(a.id).catch(() => null)));
  const urls = [];
  const slides = atts.map((a, i) => {
    const b = blobs[i], k = kind(a);
    if (!b) return `<div class="slide"><div class="fcard"><b>Файл не найден</b><small>${esc(a.name)}</small></div></div>`;
    const u = URL.createObjectURL(b); urls.push(u);
    if (k==='image') return `<div class="slide" data-zoom><img src="${u}" alt="${esc(a.name)}"></div>`;
    if (k==='video') return `<div class="slide"><video src="${u}" controls playsinline preload="metadata" ${a.thumb?`poster="${esc(a.thumb)}"`:''}></video></div>`;
    if (k==='audio') return `<div class="slide"><div class="fcard"><span class="big">${ICON.wave}</span><b>${esc(a.name)}</b><audio src="${u}" controls preload="metadata"></audio></div></div>`;
    return `<div class="slide"><div class="fcard"><span class="bigext">${esc(extOf(a.name) || 'файл')}</span><b>${esc(a.name)}</b><small>${fmtSize(a.size)}</small><button class="vbtn" data-share>Открыть в другом приложении</button></div></div>`;
  });
  vw.innerHTML = `<div class="vbar"><button id="vClose" aria-label="Закрыть">${ICON.close}</button><span id="vCount"></span><button id="vShare" aria-label="Поделиться">${ICON.share}</button></div>
    <div class="track" id="track">${slides.join('')}</div><div class="vname" id="vName"></div>`;
  vs = { atts, blobs, urls, idx:start };
  vw.hidden = false;
  const tr = $('#track'); tr.scrollLeft = start * tr.clientWidth;
  updateViewer();
  requestAnimationFrame(() => requestAnimationFrame(() => vw.classList.add('open')));
  tr.addEventListener('scroll', () => {
    const i = Math.round(tr.scrollLeft / Math.max(1, tr.clientWidth));
    if (i!==vs.idx){ vs.idx = i; tr.querySelectorAll('video,audio').forEach(m => m.pause()); updateViewer(); }
  }, {passive:true});
  let lastTap = 0, lastTouch = 0, sx = 0, sy = 0;
  tr.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
  tr.addEventListener('touchend', e => {
    lastTouch = Date.now();
    const c = e.changedTouches[0]; if (Math.abs(c.clientX-sx) > 10 || Math.abs(c.clientY-sy) > 10) { lastTap = 0; return; }
    const s = e.target.closest('[data-zoom]'); if (!s) return;
    if (Date.now()-lastTap < 300){ toggleZoom(s, c.clientX, c.clientY); lastTap = 0; } else lastTap = Date.now();
  });
  tr.addEventListener('dblclick', e => { if (Date.now()-lastTouch < 800) return; const s = e.target.closest('[data-zoom]'); if (s) toggleZoom(s, e.clientX, e.clientY); });
  $('#vClose').onclick = closeViewer;
  $('#vShare').onclick = () => shareBlob(vs.blobs[vs.idx], vs.atts[vs.idx]);
  tr.addEventListener('click', e => { if (e.target.closest('[data-share]')) shareBlob(vs.blobs[vs.idx], vs.atts[vs.idx]); });
}
function toggleZoom(s, x, y){
  const tr = $('#track'), on = !s.classList.contains('zoom');
  const r = s.getBoundingClientRect(), fx = (x - r.left)/r.width, fy = (y - r.top)/r.height;
  s.classList.toggle('zoom', on); tr.style.overflowX = on ? 'hidden' : '';
  if (on){ s.scrollLeft = (s.scrollWidth - s.clientWidth) * fx; s.scrollTop = (s.scrollHeight - s.clientHeight) * fy; }
  const img = s.querySelector('img');
  if (img && !REDUCE) img.animate([{opacity:.6,transform:on?'scale(.6)':'scale(1.4)'},{opacity:1,transform:'none'}], {duration:300,easing:SPRING});
}
function updateViewer(){

  $('#vCount').textContent = n > 1 ? `${vs.idx+1} / ${n}` : '';

}
function closeViewer(){
  const vw = $('#viewer'); if (!vs) return;
  const urls = vs.urls; vs = null;
  vw.querySelectorAll('video,audio').forEach(m => m.pause());

async function shareBlob(blob, a){
  if (!blob) return;

  document.body.appendChild(link); link.click(); setTimeout(() => { URL.revokeObjectURL(link.href); link.remove(); }, 4000);
}

/* ---------- backup (.zip with data + files; old .json backups still import) ---------- */
const CRC_T = (() => { const t = new Uint32Array(256); for (let n=0;n<256;n++){ let c=n; for (let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
function crc32(u8){ let c = 0xFFFFFFFF; for (let i=0;i<u8.length;i++) c = CRC_T[(c^u8[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
async function makeZip(entries){
  const parts = [], central = [], enc = new TextEncoder(), d = new Date();
  const dt = (d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1), dd = ((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  let off = 0, cdSize = 0;
  for (const e of entries){
    const crc = crc32(new Uint8Array(await e.blob.arrayBuffer())), size = e.blob.size, nm = enc.encode(e.name);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true);
    h.setUint16(10,dt,true); h.setUint16(12,dd,true); h.setUint32(14,crc,true); h.setUint32(18,size,true); h.setUint32(22,size,true);
    h.setUint16(26,nm.length,true); h.setUint16(28,0,true);
    parts.push(h, nm, e.blob);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true); c.setUint16(10,0,true);
    c.setUint16(12,dt,true); c.setUint16(14,dd,true); c.setUint32(16,crc,true); c.setUint32(20,size,true); c.setUint32(24,size,true);
    c.setUint16(28,nm.length,true); c.setUint32(42,off,true);
    central.push(c, nm); cdSize += 46+nm.length; off += 30+nm.length+size;
  }
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true); end.setUint16(8,entries.length,true); end.setUint16(10,entries.length,true);
  end.setUint32(12,cdSize,true); end.setUint32(16,off,true);
  return new Blob([...parts, ...central, end], {type:'application/zip'});
}
async function readZip(blob){
  const tl = Math.min(blob.size, 65557), tail = new DataView(await blob.slice(blob.size-tl).arrayBuffer());
  let p = -1; for (let i=tl-22;i>=0;i--) if (tail.getUint32(i,true)===0x06054b50){ p = i; break; }
  if (p<0) throw new Error('not zip');
  const n = tail.getUint16(p+10,true), cdSize = tail.getUint32(p+12,true), cdOff = tail.getUint32(p+16,true);
  const cd = new DataView(await blob.slice(cdOff, cdOff+cdSize).arrayBuffer()), dec = new TextDecoder(), ents = {};
  let q = 0;
  for (let k=0;k<n;k++){
    if (cd.getUint32(q,true)!==0x02014b50) throw new Error('bad zip');
    const method = cd.getUint16(q+10,true), csize = cd.getUint32(q+20,true), nl = cd.getUint16(q+28,true), el = cd.getUint16(q+30,true), cl = cd.getUint16(q+32,true), lo = cd.getUint32(q+42,true);
    ents[dec.decode(new Uint8Array(cd.buffer, cd.byteOffset+q+46, nl))] = {method, csize, lo};
    q += 46+nl+el+cl;
  }
  async function get(name, type=''){
    let e = ents[name];
    if (!e){ const k = Object.keys(ents).find(k => k.endsWith('/'+name)); if (k) e = ents[k]; }
    if (!e) return null;
    const lh = new DataView(await blob.slice(e.lo, e.lo+30).arrayBuffer());
    const start = e.lo+30+lh.getUint16(26,true)+lh.getUint16(28,true), raw = blob.slice(start, start+e.csize);
    if (e.method===0) return new Blob([raw], {type});
    if (e.method===8 && window.DecompressionStream) return new Blob([await new Response(raw.stream().pipeThrough(new DecompressionStream('deflate-raw'))).blob()], {type});
    throw new Error('compressed');
  }
  return { get };
}

    <button class="btn" id="exp">Сохранить резервную копию</button>
    <button class="btn" id="imp">Восстановить из копии</button>
    <p class="note">Если удалить значок приложения с экрана «Домой», данные удалятся вместе с ним. Сохраняйте копию в «Файлы» раз в пару недель. Копия — один .zip со всеми записями и вложениями.</p>`);
  navigator.storage?.estimate?.().then(e => { const u = $('#usage'); if (u && e.usage) u.textContent = ' Занято: '+fmtSize(e.usage)+'.'; }).catch(()=>{});
  $('#exp').onclick = () => prepareExport($('#exp'));
  $('#imp').onclick = () => pickFiles('.zip,.json,application/zip,application/json', fs => importFile(fs[0]));
}
async function prepareExport(btn){
  if (btn.dataset.ready) return;
  btn.disabled = true; btn.textContent = 'Готовлю копию…';
  try {
    const entries = [{name:'data.json', blob:new Blob([JSON.stringify({...db, format:'planner-2'})], {type:'application/json'})}];
    for (const x of db.items) for (const a of x.atts){ const b = await fget(a.id).catch(()=>null); if (b) entries.push({name:'files/'+a.id, blob:b}); }
    const zip = await makeZip(entries), name = `planner-${today()}.zip`;
    const file = new File([zip], name, {type:'application/zip'});
    if (!btn.isConnected) return;
    btn.disabled = false; btn.dataset.ready = 1; btn.classList.add('primary');
    btn.textContent = `Поделиться копией (${fmtSize(zip.size)})`; fadeIn(btn, 0);
    btn.onclick = () => shareBlob(file, {name, type:'application/zip'});
  } catch(e){
    if (btn.isConnected){ btn.disabled = false; btn.textContent = 'Сохранить резервную копию'; }
    toast('Не получилось сделать копию: '+(e.message||'ошибка'));
  }
}
async function importFile(file){
  let data, zip = null;
  try {
    if (/\.json$/i.test(file.name) || file.type==='application/json') data = JSON.parse(await file.text());
    else { zip = await readZip(file); const j = await zip.get('data.json'); if (!j) throw 0; data = JSON.parse(await j.text()); }
  } catch(e){ toast(e && e.message==='compressed' ? 'Этот архив сжат другой программой. Выберите исходный файл копии' : 'Это не файл резервной копии планера'); return; }
  const clean = sanitize(data);
  if (!clean){ toast('В файле нет данных планера'); return; }
  const nf = clean.items.reduce((s,x) => s + x.atts.length, 0);
  openSheet(`
    <div class="sh-head"><button class="link" data-close>Отмена</button><b>Восстановление</b><span style="width:60px"></span></div>
    <p class="note" style="margin-top:0">В копии: ${plural(clean.folders.length,['папка','папки','папок'])}, ${plural(clean.items.length,['запись','записи','записей'])}, ${plural(nf,['вложение','вложения','вложений'])}.<br>Текущие данные на этом iPhone будут заменены.</p>
    <button class="danger" id="doImp">Заменить данные</button>`);
  $('#doImp').onclick = async () => {
    const b = $('#doImp'); b.disabled = true; b.textContent = 'Восстанавливаю…';
    try {
      await fclear();
      for (const x of clean.items){
        const keep = [];
        for (const a of x.atts){
          const blob = zip ? await zip.get('files/'+a.id, a.type).catch(()=>null) : null;
          if (blob){ await fput(a.id, blob); keep.push(a); }
        }
        x.atts = keep;
      }
      db = clean; save(); closeSheet();
      swap('fade', () => { st.folder = null; });
      toast('Восстановлено: '+plural(db.items.length,['запись','записи','записей']));
    } catch(e){ b.disabled = false; b.textContent = 'Заменить данные'; toast('Не хватило места или файл повреждён'); }
  };
}

let toastT;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2300);
}

/* ---------- events ---------- */
view.addEventListener('click', e => {
  const chk = e.target.closest('[data-check]');
  if (chk){
    const x = db.items.find(i => i.id===chk.dataset.check); if (!x) return;
    x.done = !x.done; x.updated = Date.now(); save();
    chk.closest('.item').classList.toggle('done', x.done);
    chk.classList.remove('just'); void chk.offsetWidth; chk.classList.add('just');
    setTimeout(refresh, REDUCE ? 0 : 320);
    return;
  }
  const it = e.target.closest('.item');
  if (it){ const x = db.items.find(i => i.id===it.dataset.id); if (x) editItem(x); return; }
  const day = e.target.closest('[data-date]');
  if (day){ if (day.dataset.date!==st.sel) selectDay(day.dataset.date); return; }
  const fr = e.target.closest('[data-folder]');
  if (fr){ swap('push', () => { st.folder = fr.dataset.folder; st.filter = 'all'; }); return; }
  const fl = e.target.closest('[data-filter]');
  if (fl){
    if (fl.dataset.filter===st.filter) return;
    st.filter = fl.dataset.filter;
    document.querySelectorAll('#filterSeg button').forEach(b => b.classList.toggle('on', b===fl));
    movePill($('#filterSeg'));
    const fb = $('#fBody'); fb.innerHTML = folderBody(folderById(st.folder)); fadeIn(fb);
    return;
  }
  if (e.target.closest('#prevM')) return setMonth(new Date(st.month.getFullYear(), st.month.getMonth()-1, 1), -1);
  if (e.target.closest('#nextM')) return setMonth(new Date(st.month.getFullYear(), st.month.getMonth()+1, 1), 1);
  if (e.target.closest('#toToday')){ if (st.sel!==today() || st.month.getMonth()!==new Date().getMonth()) { const t = today(); const dir = t > st.sel ? 1 : -1; st.sel = t; setMonth(new Date(), st.month.getTime()===new Date(new Date().getFullYear(), new Date().getMonth(), 1).getTime() ? 0 : dir); view.querySelectorAll('.day.sel').forEach(e=>e.classList.remove('sel')); view.querySelector(`[data-date="${t}"]`)?.classList.add('sel'); const dp = $('#dayPane'); dp.innerHTML = dayPane(); fadeIn(dp); } return; }
  if (e.target.closest('#newFolder')) editFolder({});
});
// swipes: months in the calendar, back from the left edge inside a folder
let sx0 = null, sy0 = null, tmode = null;
view.addEventListener('touchstart', e => {
  const t = e.touches[0]; sx0 = t.clientX; sy0 = t.clientY;
  tmode = e.target.closest('#calBox') ? 'cal' : (st.folder && sx0 < 28 ? 'edge' : null);
}, {passive:true});
view.addEventListener('touchend', e => {
  if (!tmode) return;
  const c = e.changedTouches[0], dx = c.clientX - sx0, dy = c.clientY - sy0, m = tmode; tmode = null;
  if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy)*1.5) return;
  if (m==='cal') setMonth(new Date(st.month.getFullYear(), st.month.getMonth()+(dx<0?1:-1), 1), dx<0?1:-1);
  else if (m==='edge' && dx > 0) swap('pop', () => { st.folder = null; });
});
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
  const t = b.dataset.tab;
  if (st.tab===t){ if (t==='folders' && st.folder) swap('pop', () => { st.folder = null; }); else view.scrollTo({top:0, behavior:REDUCE?'auto':'smooth'}); return; }
  swap('fade', () => { st.tab = t; });
}));
$('#back').onclick = () => swap('pop', () => { st.folder = null; });
$('#action').onclick = () => { if (st.tab==='folders' && st.folder) editFolder(folderById(st.folder)); else settings(); };
$('#fab').onclick = () => {
  if (st.tab==='cal') editItem({ type:'task', date:st.sel, folderId:ensureFolder() });
  else if (st.folder) editItem({ type: st.filter==='note' ? 'note' : 'task', folderId:st.folder });
  else editFolder({});
};
document.addEventListener('keydown', e => { if (e.key==='Escape'){ if (vs) closeViewer(); else closeSheet(); } });

/* ---------- init ---------- */
document.querySelector('[data-tab="cal"]').innerHTML = ICON.cal+'Календарь';
document.querySelector('[data-tab="folders"]').innerHTML = ICON.folder+'Папки';
$('#fab').innerHTML = ICON.plus;
loadDb().then(d => {
  db = d; save(); render(); fadeIn(view, 8);
  setTimeout(cleanupFiles, 1500);
});
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && today()!==lastToday){ lastToday = today(); render(); }
});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
if ('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
