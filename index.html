<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Планер">
<meta name="theme-color" content="#eef1ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1311" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Планер</title>
<style>
/* Layout: one-screen app — header, scrolling content, floating "+" and bottom tab bar; sheets slide up from the bottom */
:root{
  --al:#2f6f5e; --ad:#5fb39a;
  --bg:#eef1ee; --surface:#ffffff; --ink:#16201b; --muted:#6a766f; --line:#dce2dd;
  --accent:var(--al); --accent-ink:#ffffff; --danger:#c2412d; --shadow:rgba(10,20,15,.14);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --spring:cubic-bezier(.32,.72,0,1);
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0f1311; --surface:#1a201d; --ink:#e7ece8; --muted:#8c9790; --line:#29312d;
    --accent:var(--ad); --accent-ink:#0f1311; --danger:#ef6a55; --shadow:rgba(0,0,0,.45); color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#0f1311; --surface:#1a201d; --ink:#e7ece8; --muted:#8c9790; --line:#29312d;
  --accent:var(--ad); --accent-ink:#0f1311; --danger:#ef6a55; --shadow:rgba(0,0,0,.45); color-scheme:dark; }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--font);-webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-user-select:none;user-select:none;transition:background .3s}
input,textarea,select{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{opacity:.55}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
svg{display:block}

#app{display:flex;flex-direction:column;height:100%;overflow:hidden}
.top{display:flex;align-items:center;gap:4px;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 8px;position:relative;z-index:4;background:var(--bg);transition:background .3s}
.top h1{flex:1;margin:0;font:700 30px/1.15 var(--round);letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#back{font-size:34px;line-height:1;color:var(--accent);padding:0 8px 6px 0}
#searchBtn{width:38px;height:38px;display:grid;place-items:center;color:var(--accent);flex:none;border-radius:50%;transition:background .2s}
#searchBtn:active{background:color-mix(in srgb,var(--accent) 14%,transparent)}
#searchBtn svg{width:23px;height:23px}
#action{color:var(--accent);font-weight:600;font-size:15px;padding:8px 0 8px 6px;flex:none}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px calc(env(safe-area-inset-bottom,0px) + 150px);position:relative;z-index:2;background:var(--bg);transition:background .3s}

/* page transitions */
.ghost{position:fixed;left:0;right:0;overflow:hidden;padding:4px 16px 0;background:var(--bg);pointer-events:none}
.ghost.push{z-index:1;animation:pushOut .44s var(--spring) forwards}
.ghost.pop{z-index:3;animation:popOut .44s var(--spring) forwards;box-shadow:-14px 0 30px var(--shadow)}
.ghost.fade{z-index:3;animation:fadeOut .2s ease-out forwards}
main.in-push{animation:pushIn .44s var(--spring);box-shadow:-14px 0 30px var(--shadow)}
main.in-pop{animation:popIn .44s var(--spring)}
main.in-fade{animation:fadeIn .32s var(--ease)}
@keyframes pushIn{from{transform:translateX(100%)}}
@keyframes pushOut{to{transform:translateX(-28%);opacity:.5}}
@keyframes popIn{from{transform:translateX(-28%);opacity:.5}}
@keyframes popOut{to{transform:translateX(100%)}}
@keyframes fadeOut{to{opacity:0}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}

.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;z-index:5;
  background:color-mix(in srgb,var(--surface) 86%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  border-top:1px solid var(--line);padding:6px 10px calc(env(safe-area-inset-bottom,0px) + 6px)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:4px;transition:color .2s}
.tabs button.on{color:var(--accent)}
.tabs svg{width:26px;height:26px;transition:transform .35s var(--spring)}
.tabs button:active svg{transform:scale(.82)}
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 76px);z-index:6;width:58px;height:58px;border-radius:50%;
  background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 22px var(--shadow);transition:transform .3s var(--spring),opacity .2s}
.fab:active{transform:scale(.88)}
.fab.off{transform:scale(.4);opacity:0;pointer-events:none}
.fab svg{width:28px;height:28px}

/* Today */
.hero{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin:0 4px 4px;color:var(--muted);font-size:15px}
.hero b{color:var(--ink);font-weight:600}
.qadd{display:flex;gap:8px;align-items:stretch}
.qadd .inp{flex:1;min-width:0;padding:12px 14px}
.qadd button{flex:none;border-radius:12px;font-weight:600;font-size:14px}
#qDate{padding:0 12px;background:var(--surface);border:1px solid var(--line);color:var(--accent);min-width:92px;transition:transform .3s var(--spring)}
#qDate:active{transform:scale(.94)}
#qGo{width:46px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;transition:transform .3s var(--spring)}
#qGo:active{transform:scale(.9)}
#qGo svg{width:22px;height:22px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:12px -16px 0;padding:0 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:600;transition:background .2s,color .2s,border-color .2s}
.chips button i{width:8px;height:8px;border-radius:50%}
.chips button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chips button.on i{box-shadow:0 0 0 1.5px var(--accent-ink)}
.cnt{font-weight:600;color:var(--muted);font-size:13px}
.togg{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;margin:24px 0 8px;padding:0 4px;color:var(--muted)}
.togg h2{margin:0;font:650 18px var(--round);color:var(--muted)}
.togg .arr{transition:transform .35s var(--spring)}
.togg.open .arr{transform:rotate(90deg)}
.allclear{text-align:center;padding:34px 16px 10px;color:var(--muted)}
.allclear b{display:block;font:650 19px var(--round);color:var(--ink);margin-bottom:4px}
.parity{color:var(--accent);font-weight:650;font-size:13px;padding:2px 9px;border-radius:9px;background:color-mix(in srgb,var(--accent) 12%,transparent)}

/* Calendar */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px 10px 10px}
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 10px 8px}
.cal-head b{font:650 19px var(--round)}
.nav{display:flex;gap:2px;align-items:center}
.nav button{min-width:36px;height:36px;border-radius:10px;color:var(--accent);font-size:22px;line-height:1;transition:background .2s}
.nav button:active{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.nav .tod{font-size:14px;font-weight:600;padding:0 10px}
.gridwrap{overflow:hidden}
.wd,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd span{text-align:center;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding-bottom:4px}
.wd span:nth-child(n+6){color:var(--danger);opacity:.8}
.day{aspect-ratio:1/1.08;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-size:16px;font-variant-numeric:tabular-nums;position:relative;transition:background .25s,color .25s,transform .3s var(--spring)}
.day:active{transform:scale(.9)}
.day span{line-height:1}
.day.out{opacity:.38}
.day.has{background:color-mix(in srgb,var(--c) 20%,transparent);font-weight:600}
.day.today span{color:var(--accent);font-weight:800}
.day.sel{background:var(--accent);color:var(--accent-ink)}
.day.sel.today span{color:inherit}
.day b{display:flex;gap:3px;height:5px}
.day b i{width:5px;height:5px;border-radius:50%}
.day.sel b i{box-shadow:0 0 0 1.5px var(--accent-ink)}
.day.late::after{content:"";position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--danger)}

.sechead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:22px 4px 8px;min-height:28px}
.sechead h2{margin:0;font:650 18px var(--round)}
.sechead.warn h2{color:var(--danger)}
.sechead small{color:var(--muted);font-size:13px;white-space:nowrap}
.minibtn{font-size:13px;font-weight:650;color:var(--accent);padding:5px 11px;border-radius:9px;background:color-mix(in srgb,var(--accent) 12%,transparent);transition:transform .3s var(--spring)}
.minibtn:active{transform:scale(.94)}
.sub{font-size:12px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:20px 4px 8px}
.sub.small{margin-top:14px}

/* Lists */
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.list>li{border-bottom:1px solid var(--line)}
.list>li:last-child{border-bottom:0}
.item{position:relative;overflow:hidden;background:var(--surface)}
.sw{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--surface);position:relative;z-index:1;touch-action:pan-y;transition:background .2s}
.sw:active{background:color-mix(in srgb,var(--ink) 4%,var(--surface))}
.sw-bg{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 20px;font-weight:650;font-size:14px;transition:background .15s}
.sw-bg span{display:flex;align-items:center;gap:6px;opacity:0;transition:opacity .15s,transform .25s var(--spring)}
.sw-bg svg{width:20px;height:20px}
.item.sw-right .sw-bg{background:var(--accent);color:var(--accent-ink)}
.item.sw-right .sw-l{opacity:1}
.item.sw-left .sw-bg{background:var(--danger);color:#fff}
.item.sw-left .sw-r{opacity:1}
.item.armed .sw-bg span{transform:scale(1.15)}
.check{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;transition:background .2s,border-color .2s}
.check.on{background:var(--accent);border-color:var(--accent)}
.check.on::after{content:"";width:10px;height:5px;border-left:2px solid var(--accent-ink);border-bottom:2px solid var(--accent-ink);transform:translateY(-1px) rotate(-45deg)}
.check.just{animation:pop .35s var(--spring)}
.item .t{transition:color .25s}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.noteic{flex:none;width:24px;height:24px;color:var(--muted)}
.txt{flex:1;min-width:0}
.t{font-weight:550;overflow-wrap:anywhere}
.pinI{display:inline-block;width:15px;height:15px;color:#e0a21a;vertical-align:-1px;margin-right:5px}
.pinI svg{width:100%;height:100%}
.b{color:var(--muted);font-size:14px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;white-space:pre-line}
.meta{display:flex;gap:4px 10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:4px}
.meta:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:4px}
.chip i{width:8px;height:8px;border-radius:50%}
.chip svg{width:14px;height:14px}
.meta .late{color:var(--danger);font-weight:650}
.rthumb{flex:none;width:46px;height:46px;border-radius:10px;object-fit:cover;background:var(--line)}
.tcol{flex:none;width:44px;display:flex;flex-direction:column;font-variant-numeric:tabular-nums;font-size:14px;font-weight:650;line-height:1.3;padding-top:2px}
.tcol small{font-weight:500;color:var(--muted);font-size:12.5px}
.lesson{display:flex;gap:12px;align-items:stretch;padding:11px 14px;cursor:pointer;transition:background .2s,opacity .3s}
.lesson:active{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.lbar{flex:none;width:4px;border-radius:2px;background:var(--accent)}
.lesson .t{font-weight:600}
.lesson.live{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.lesson.past{opacity:.5}
.lesson .m{font-size:12.5px;color:var(--muted);margin-top:2px}
.livebadge{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;margin-left:6px}
.list>li.nowline{position:relative;height:0;border:0;border-top:2px solid var(--danger);margin:0 14px 0 58px;overflow:visible}
.list>li.nowline:first-child{margin-top:12px}
.list>li.nowline:last-child{margin-bottom:12px}
.nowline span{position:absolute;left:-50px;top:-10px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;padding:1px 6px;border-radius:8px;font-variant-numeric:tabular-nums}
.nowline::before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--danger)}
.empty{color:var(--muted);text-align:center;padding:22px 16px;border:1.5px dashed var(--line);border-radius:16px;font-size:15px}

.frow{display:flex;align-items:center;gap:12px;padding:13px 14px;transition:background .2s;cursor:pointer}
.frow:active{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.fic{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff}
.fic svg{width:22px;height:22px}
.frow .m{font-size:13px;color:var(--muted)}
.arr{color:var(--muted);font-size:24px;line-height:1}
.ghostbtn{margin-top:12px;width:100%;padding:14px;border-radius:14px;color:var(--accent);font-weight:600;border:1.5px dashed var(--line)}
.search{margin:2px 0 4px}

.seg{display:flex;background:color-mix(in srgb,var(--ink) 8%,transparent);border-radius:11px;padding:3px;margin-bottom:6px;position:relative}
.seg button{flex:1;padding:7px 2px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted);position:relative;z-index:1;transition:color .25s;min-width:0}
.seg button.on{color:var(--ink)}
.seg .pill{position:absolute;top:3px;bottom:3px;left:3px;border-radius:9px;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.14);transition:transform .38s var(--spring),width .38s var(--spring)}

/* Sheet */
.sheet-wrap{position:fixed;inset:0;background:rgba(0,0,0,0);display:flex;align-items:flex-end;z-index:20;transition:background .32s ease}
.sheet-wrap.open{background:rgba(0,0,0,.38)}
.sheet{width:100%;max-height:94%;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;
  padding:6px 16px calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateY(105%);transition:transform .46s var(--spring);will-change:transform}
.sheet-wrap.open .sheet{transform:none}
.grab{width:100%;height:18px;display:grid;place-items:center;touch-action:none}
.grab::before{content:"";width:38px;height:5px;border-radius:3px;background:var(--line)}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0 14px;touch-action:none}
.sh-head b{font-weight:650}
.link{color:var(--accent);font-size:16px;padding:6px 0;min-width:60px;text-align:left}
.link.strong{font-weight:700;text-align:right}
.inp{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;-webkit-appearance:none;appearance:none;transition:border-color .2s}
.inp:focus{border-color:var(--accent)}
#fTitle{font-weight:600;font-size:18px}
textarea.inp{min-height:110px;resize:vertical;margin-top:8px;line-height:1.45;transition:min-height .35s var(--spring),border-color .2s}
textarea.inp.big{min-height:30vh}
.field{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 10px 4px 14px;margin-top:10px;min-height:50px}
.field>span{color:var(--muted);flex:none;width:62px}
.field>span.wide{flex:1;width:auto;color:var(--ink)}
.field input,.field select{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);border:0;background:none;padding:10px 0;outline:none}
.field .link{font-size:14px;flex:none;min-width:0}
.field .tgl{flex:none;-webkit-appearance:none;appearance:none;width:51px;height:31px;border-radius:16px;background:var(--line);position:relative;transition:background .25s;padding:0;margin:0;cursor:pointer}
.field .tgl::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .32s var(--spring)}
.field .tgl:checked{background:var(--accent)}
.field .tgl:checked::after{transform:translateX(20px)}
.danger{width:100%;margin-top:12px;padding:14px;border-radius:12px;background:color-mix(in srgb,var(--danger) 13%,transparent);color:var(--danger);font-weight:650}
.danger.first{margin-top:22px}
.swatches{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;padding:4px}
.swatches button{width:36px;height:36px;border-radius:50%;transition:box-shadow .2s,transform .3s var(--spring)}
.swatches button:active{transform:scale(.85)}
.swatches button.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
.icons{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;margin-top:12px}
.icons button{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;color:var(--muted);background:var(--surface);border:1px solid var(--line);transition:background .2s,color .2s,transform .3s var(--spring)}
.icons button:active{transform:scale(.88)}
.icons button.on{color:#fff;background:var(--fc);border-color:var(--fc)}
.icons svg{width:21px;height:21px}
.fprev{width:68px;height:68px;border-radius:18px;margin:0 auto 14px;display:grid;place-items:center;color:#fff;background:var(--fc);transition:background .3s}
.fprev svg{width:36px;height:36px}
.btn{display:block;width:100%;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:600;margin-top:10px;text-align:left}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);text-align:center}
.rowbtn{display:flex;align-items:center;gap:10px}
.rowbtn span:first-child{flex:1}
.rowbtn .m{font-weight:500;color:var(--muted);font-size:14px}
.note{color:var(--muted);font-size:14px;margin:12px 4px 0;line-height:1.45}
.atlabel{display:flex;justify-content:space-between;align-items:baseline;margin:18px 4px 0;font-size:12px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.slots button{padding:7px 2px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:650;line-height:1.25;transition:background .2s,color .2s}
.slots button small{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.slots button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.slots button.on small{color:inherit}

/* Markdown */
.mdbar{display:flex;gap:4px;margin-top:10px}
.mdbar button{flex:1;min-width:0;height:36px;border-radius:9px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:15px;display:grid;place-items:center;transition:transform .25s var(--spring)}
.mdbar button:active{transform:scale(.9)}
.mdbar svg{width:19px;height:19px;color:var(--accent)}
.mdview{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:8px;min-height:56px;line-height:1.5;overflow-wrap:anywhere;cursor:text}
.mdview h3{font:700 21px/1.25 var(--round);margin:6px 0 4px}
.mdview h4{font:700 18px/1.3 var(--round);margin:6px 0 2px}
.mdview h5{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:8px 0 2px}
.mdview p{margin:2px 0}
.mdview ul,.mdview ol{margin:4px 0;padding-left:22px}
.mdview ul.chk{list-style:none;padding-left:0}
.mdview ul.chk li{display:flex;gap:10px;align-items:flex-start;margin:5px 0}
.mdc{flex:none;width:21px;height:21px;border-radius:6px;border:2px solid var(--muted);margin-top:1px;display:grid;place-items:center;transition:background .2s,border-color .2s}
.mdc.on{background:var(--accent);border-color:var(--accent)}
.mdc.on::after{content:"";width:9px;height:5px;border-left:2px solid var(--accent-ink);border-bottom:2px solid var(--accent-ink);transform:translateY(-1px) rotate(-45deg)}
.mdc.just{animation:pop .35s var(--spring)}
.mdc.on+span{text-decoration:line-through;color:var(--muted)}
.mdview blockquote{margin:6px 0;padding:2px 12px;border-left:3px solid var(--accent);color:var(--muted)}
.mdview code{font-family:var(--mono);font-size:.88em;background:color-mix(in srgb,var(--ink) 8%,transparent);padding:1px 5px;border-radius:5px}
.mdview hr{border:0;border-top:1px solid var(--line);margin:10px 0}
.mdview a{color:var(--accent)}
.md-gap{height:8px}

/* Subtasks */
.subs{list-style:none;margin:8px 0 0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.subs:empty{display:none}
.subs li{display:flex;align-items:center;gap:10px;padding:2px 6px 2px 12px;border-bottom:1px solid var(--line);animation:tileIn .3s var(--spring)}
.subs li:last-child{border-bottom:0}
.subs .check{width:22px;height:22px}
.subs input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;color:var(--ink);padding:10px 0;outline:none}
.subs li.done input{text-decoration:line-through;color:var(--muted)}
.subs .x2{flex:none;width:32px;height:32px;color:var(--muted);font-size:21px;line-height:1}
.subadd{display:flex;gap:8px;margin-top:8px}
.subadd .inp{padding:10px 14px}
.subadd button{flex:none;width:44px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--accent);display:grid;place-items:center}
.subadd svg{width:20px;height:20px}
.prog{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .4s var(--spring)}

/* Attachments */
.atbar{display:flex;gap:8px;margin-top:8px}
.atbar button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 6px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--accent);transition:transform .3s var(--spring)}
.atbar button:active{transform:scale(.95)}
.atbar svg{width:20px;height:20px}
.rec{display:flex;align-items:center;gap:12px;margin-top:8px;padding:8px 14px;border-radius:12px;background:color-mix(in srgb,var(--danger) 12%,transparent);min-height:46px}
.rec i{width:10px;height:10px;border-radius:50%;background:var(--danger);animation:blink 1.1s ease-in-out infinite}
.rec b{flex:1;font-variant-numeric:tabular-nums;color:var(--danger)}
.rec .link{min-width:0}
@keyframes blink{50%{opacity:.25}}
.atts{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;margin-top:10px}
.atts:empty{display:none}
.tile{position:relative;aspect-ratio:1;border-radius:12px;background:var(--surface);border:1px solid var(--line);overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;cursor:pointer;animation:tileIn .36s var(--spring)}
@keyframes tileIn{from{transform:scale(.7);opacity:0}}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .tic{width:28px;height:28px;color:var(--accent)}
.tile .tic svg{width:100%;height:100%}
.tile .ext{font:700 14px var(--round);color:var(--accent);text-transform:uppercase}
.tile .nm{font-size:10.5px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .play{position:absolute;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;display:grid;place-items:center}
.tile .play svg{width:14px;height:14px;margin-left:2px}
.tile .dur{position:absolute;left:5px;bottom:5px;font-size:10.5px;font-weight:650;color:#fff;background:rgba(0,0,0,.55);padding:1px 5px;border-radius:6px;font-variant-numeric:tabular-nums}
.tile.k-audio .dur{position:static;background:none;color:var(--muted);padding:0}
.tile .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;font-size:16px;line-height:1;z-index:2}
.tile.busy::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
.tile.busy>*{opacity:.35}
@keyframes spin{to{transform:rotate(360deg)}}

/* Viewer */
.viewer{position:fixed;inset:0;z-index:40;background:#000;color:#fff;display:flex;flex-direction:column;opacity:0;transition:opacity .25s ease}
.viewer.open{opacity:1}
.viewer .track{transform:scale(.94);transition:transform .38s var(--spring)}
.viewer.open .track{transform:none}
.vbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 6px) 12px 6px}
.vbar button{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.12)}
.vbar svg{width:22px;height:22px}
#vCount{font-size:14px;font-weight:600;opacity:.8;font-variant-numeric:tabular-nums}
.track{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;min-height:0}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:6px;min-width:0}
.slide img,.slide video{max-width:100%;max-height:100%;object-fit:contain;display:block}
.slide.zoom{overflow:auto;align-items:flex-start;justify-content:flex-start}
.slide.zoom img{max-width:none;max-height:none;width:240%}
.fcard{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:24px;max-width:340px;width:100%}
.fcard .big{width:64px;height:64px;color:#9fd8c6}
.fcard .big svg{width:100%;height:100%}
.fcard .bigext{font:800 30px var(--round);color:#9fd8c6;text-transform:uppercase;border:2px solid currentColor;border-radius:16px;padding:18px 16px;min-width:96px}
.fcard b{overflow-wrap:anywhere}
.fcard small{opacity:.65}
.fcard audio{width:100%}
.vbtn{margin-top:6px;padding:12px 18px;border-radius:12px;background:#fff;color:#000;font-weight:650}
.vname{padding:8px 16px calc(env(safe-area-inset-bottom,0px) + 14px);text-align:center;font-size:13px;opacity:.7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);
  padding:10px 12px 10px 16px;border-radius:14px;font-size:14px;z-index:50;width:max-content;max-width:calc(100% - 32px);display:flex;align-items:center;gap:12px;
  pointer-events:none;transition:transform .4s var(--spring),opacity .25s}
.toast.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.toast button{flex:none;padding:6px 12px;border-radius:9px;background:var(--bg);color:var(--ink);font-weight:700;font-size:14px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const today = () => ymd(new Date());
const addDays = (k, n) => { const d = parse(k); d.setDate(d.getDate()+n); return ymd(d); };
const hmNow = () => { const d = new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); };
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const okColor = c => /^#[0-9a-f]{6}$/i.test(c) ? c : COLORS[7];
const okDate = d => typeof d === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(d) ? d : null;
const okTime = t => typeof t === 'string' && /^\d{2}:\d{2}$/.test(t) ? t : null;
function plural(n, f){ const a=n%10, b=n%100; return n+' '+(a===1&&b!==11?f[0]:a>=2&&a<=4&&(b<10||b>=20)?f[1]:f[2]); }
function fmtSize(b){ if(!b) return '0 КБ'; const u=['Б','КБ','МБ','ГБ']; let i=0; while(b>=1024&&i<3){b/=1024;i++;} return (b<10&&i?b.toFixed(1):Math.round(b))+' '+u[i]; }
function fmtDur(s){ s=Math.round(s||0); return Math.floor(s/60)+':'+pad(s%60); }
const extOf = name => (String(name).match(/\.([a-z0-9]{1,5})$/i)||[])[1]?.toLowerCase() || '';
const TYPES = {jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',gif:'image/gif',webp:'image/webp',heic:'image/heic',mp4:'video/mp4',mov:'video/quicktime',m4v:'video/mp4',
  mp3:'audio/mpeg',m4a:'audio/mp4',wav:'audio/wav',aac:'audio/aac',ogg:'audio/ogg',webm:'audio/webm',pdf:'application/pdf'};

/* ---------- storage: IndexedDB for data + files, localStorage as fallback ---------- */
let _idb;
function idb(){
  return _idb ||= new Promise((res, rej) => {
    const r = indexedDB.open('planner', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('files'); r.result.createObjectStore('kv'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function tx(store, mode, fn){
  const d = await idb();
  return new Promise((res, rej) => {
    const t = d.transaction(store, mode); let out;
    const r = fn(t.objectStore(store)); if (r) r.onsuccess = () => { out = r.result; };
    t.oncomplete = () => res(out); t.onerror = t.onabort = () => rej(t.error);
  });
}
const fput = (id, b) => tx('files','readwrite', s => s.put(b, id));
const fget = id => tx('files','readonly', s => s.get(id));
const fdel = ids => ids.length ? tx('files','readwrite', s => { ids.forEach(i => s.delete(i)); }) : Promise.resolve();
const fkeys = () => tx('files','readonly', s => s.getAllKeys());
const fclear = () => tx('files','readwrite', s => s.clear());
const kvGet = k => tx('kv','readonly', s => s.get(k));
const kvPut = (k, v) => tx('kv','readwrite', s => s.put(v, k));
async function storeBlob(id, f){
  try { await fput(id, f); }
  catch(e){ await fput(id, new Blob([await f.arrayBuffer()], {type: f.type})); }

/* ---------- domain logic ---------- */
const folderById = id => db.folders.find(f => f.id === id);
const fcolor = id => folderById(id)?.color || COLORS[7];
function ensureFolder(){ if (!db.folders.length){ db.folders.push({id:uid(),name:'Общее',color:COLORS[0],icon:'folder'}); save(); } return db.folders[0].id; }

function occursOn(x, k){
  if (!x.date || k < x.date) return false;
  const r = x.repeat; if (!r) return k===x.date;
  if (r.until && k > r.until) return false;
  if (x.skip.includes(k)) return false;
  const d = parse(k), s = parse(x.date);
  switch (r.freq){
    case 'daily': return true;
    case 'weekdays': { const w = d.getDay(); return w>0 && w<6; }
    case 'weekly': return d.getDay()===s.getDay();
    case 'biweekly': return d.getDay()===s.getDay() && Math.round((d-s)/6048e5)%2===0;
    case 'monthly': { const dim = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); return d.getDate()===Math.min(s.getDate(), dim); }
    case 'yearly': return d.getMonth()===s.getMonth() && d.getDate()===s.getDate();
  }
  return false;
}
const doneAt = (x, k) => x.repeat ? x.doneDates.includes(k) : x.done;
function nextOcc(x){
  let k = today() > x.date ? today() : x.date;
  for (let i=0;i<800;i++){
    if (x.repeat.until && k > x.repeat.until) return null;
    if (occursOn(x,k) && !x.doneDates.includes(k)) return k;
    k = addDays(k,1);
  }
  return null;
}
const itemsOn = k => db.items.filter(x => occursOn(x,k));
const isLate = x => x.type==='task' && !x.repeat && !x.done && x.date && x.date < today();

function sortItems(arr, k){
  k ||= today();
  const key = new Map(arr.map(x => [x, (x.repeat ? (nextOcc(x)||'9999') : (x.date||'9999')) + (x.time||'99')]));
  return arr.slice().sort((a,b) => {
    if (a.type!==b.type) return a.type==='task' ? -1 : 1;
    const da = a.type==='task' && doneAt(a,k), dB = b.type==='task' && doneAt(b,k);
    if (da!==dB) return da ? 1 : -1;
    if (!!a.pin!==!!b.pin) return a.pin ? -1 : 1;
    if (a.type==='task'){ const ka = key.get(a), kb = key.get(b); if (ka!==kb) return ka<kb ? -1 : 1; }
    return (b.updated||0)-(a.updated||0);
  });
}

function mondayOf(k){ const d = parse(k); d.setDate(d.getDate()-((d.getDay()+6)%7)); return ymd(d); }
function weekOdd(k){
  const ref = db.schedule.ref; if (!ref) return true;
  const diff = Math.round((parse(mondayOf(k)) - parse(ref.monday))/6048e5);
  return (Math.abs(diff)%2===0) === ref.odd;
}
function lessonsOn(k){
  const S = db.schedule; if (!S.lessons.length) return [];
  if ((S.from && k < S.from) || (S.to && k > S.to)) return [];
  const wd = (parse(k).getDay()+6)%7+1, odd = weekOdd(k);
  return S.lessons.filter(l => l.wd===wd && (l.week==='all' || (l.week==='odd')===odd)).sort((a,b) => a.start<b.start ? -1 : 1);
}

/* ---------- markdown ---------- */
function inl(s){
  return s.replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\w)/g,'$1<i>$2</i>')
    .replace(/~~([^~]+)~~/g,'<s>$1</s>')
    .replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)])/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
}
function md(src){
  const lines = esc(src).split('\n'), out = []; let list = null;
  const open = t => { if (list!==t){ close(); out.push(t==='chk' ? '<ul class="chk">' : `<${t}>`); list = t; } };
  const close = () => { if (list){ out.push(list==='chk' ? '</ul>' : `</${list}>`); list = null; } };
  lines.forEach((ln, i) => {
    let m;
    if ((m = ln.match(/^\s*[-*] \[( |x|X)\] ?(.*)$/))){ open('chk'); out.push(`<li><button class="mdc ${m[1]!==' '?'on':''}" data-line="${i}" aria-label="Отметить"></button><span>${inl(m[2])}</span></li>`); return; }
    if ((m = ln.match(/^\s*[-*•] (.*)$/))){ open('ul'); out.push(`<li>${inl(m[1])}</li>`); return; }
    if ((m = ln.match(/^\s*\d+[.)] (.*)$/))){ open('ol'); out.push(`<li>${inl(m[1])}</li>`); return; }
    close();
    if ((m = ln.match(/^(#{1,3}) (.*)$/))) out.push(`<h${m[1].length+2}>${inl(m[2])}</h${m[1].length+2}>`);
    else if (/^\s*(-{3,}|\*{3,}|—)\s*$/.test(ln)) out.push('<hr>');
    else if ((m = ln.match(/^&gt; ?(.*)$/))) out.push(`<blockquote>${inl(m[1])}</blockquote>`);
    else if (!ln.trim()) out.push('<div class="md-gap"></div>');
    else out.push(`<p>${inl(ln)}</p>`);
  });
  close();
  return out.join('');
}
function mdPlain(s){
  return s.split('\n').map(l => l.replace(/^\s*[-*] \[[xX]\] ?/,'☑ ').replace(/^\s*[-*] \[ \] ?/,'☐ ').replace(/^#{1,3} /,'').replace(/^> ?/,'').replace(/^\s*[-*] /,'• '))
    .filter(l => l.trim() && !/^\s*(-{3,}|\*{3,})\s*$/.test(l)).join('\n').replace(/\*\*|~~|`/g,'');
}

/* ---------- animation helpers ---------- */
const view = $('#view');
function swap(kind, mutate){
  if (REDUCE){ mutate(); render(); view.scrollTop = 0; return; }
  document.querySelectorAll('.ghost').forEach(g => g.remove());
  const r = view.getBoundingClientRect();
  const g = document.createElement('div'); g.className = 'ghost '+kind;
  g.style.top = r.top+'px'; g.style.height = r.height+'px';
  const inner = document.createElement('div'); inner.innerHTML = view.innerHTML;
  inner.style.transform = `translateY(${-view.scrollTop}px)`;
  inner.querySelectorAll('[id]').forEach(e => e.removeAttribute('id'));
  g.appendChild(inner); document.body.appendChild(g);
  mutate(); render(); view.scrollTop = 0;
  view.classList.remove('in-push','in-pop','in-fade'); void view.offsetWidth; view.classList.add('in-'+kind);
  g.addEventListener('animationend', () => g.remove(), {once:true});
  setTimeout(() => g.remove(), 800);
}
view.addEventListener('animationend', e => { if (e.target===view) view.classList.remove('in-push','in-pop','in-fade'); });

function flip(fn){
  const before = new Map();
  view.querySelectorAll('[data-key]').forEach(el => before.set(el.dataset.key, el.getBoundingClientRect()));
  fn();
  if (REDUCE) return;
  view.querySelectorAll('[data-key]').forEach(el => {
    const b = before.get(el.dataset.key), a = el.getBoundingClientRect();
    if (!b){ el.animate([{opacity:0,transform:'scale(.96)'},{opacity:1,transform:'none'}], {duration:300,easing:'ease-out'}); return; }
    const dx = b.left-a.left, dy = b.top-a.top;
    if (Math.abs(dx)<1 && Math.abs(dy)<1) return;
    el.style.zIndex = 1;
    el.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}], {duration:420,easing:SPRING}).onfinish = () => { el.style.zIndex = ''; };
  });
}
function fadeIn(el, y=6){ if (!REDUCE && el) el.animate([{opacity:0,transform:`translateY(${y}px)`},{opacity:1,transform:'none'}], {duration:280,easing:'ease-out'}); }

/* ---------- rows ---------- */
function row(x, o={}){
  const t = today(), occ = o.occ || '', rec = !!x.repeat;
  const ck = rec ? (occ || (occursOn(x,t) ? t : '')) : '';
  const done = x.type==='task' && (rec ? (!!ck && x.doneDates.includes(ck)) : x.done);
  const canCheck = x.type==='task' && (!rec || !!ck);
  const f = o.folder ? folderById(x.folderId) : null;
  const lead = x.type==='task'
    ? (canCheck ? `<button class="check ${done?'on':''}" data-check="${x.id}" data-occ="${ck}" aria-label="${done?'Отметить невыполненной':'Отметить выполненной'}"></button>` : `<span class="noteic">${ICON.repeat}</span>`)
    : `<span class="noteic">${ICON.note}</span>`;
  const meta = [];
  if (f) meta.push(`<span class="chip"><i style="background:${okColor(f.color)}"></i>${esc(f.name)}</span>`);
  if (rec){ const n = occ ? null : nextOcc(x); meta.push(`<span class="chip">${ICON.repeat}${REPEATS[x.repeat.freq]}${n ? ' · '+fmtShort(n) : ''}${x.time && !o.time ? ', '+x.time : ''}</span>`); }
  else if (x.date && !o.noDate) meta.push(`<span class="${isLate(x)?'late':''}">${fmtShort(x.date)}${x.time?', '+x.time:''}</span>`);
  else if (x.time && o.noDate && !o.time) meta.push(`<span>${x.time}</span>`);
  if (x.subs.length) meta.push(`<span class="chip">${ICON.list}${x.subs.filter(s=>s.done).length}/${x.subs.length}</span>`);
  if (x.atts.length) meta.push(`<span class="chip">${ICON.clip}${x.atts.length}</span>`);
  const th = x.atts.find(a => a.thumb);
  const title = x.title || (x.atts.length && !x.body ? x.atts[0].name : (x.body ? mdPlain(x.body).split('\n')[0].slice(0,60) : 'Без названия'));
  const prev = x.body && x.title ? mdPlain(x.body) : '';
  const pinI = x.pin ? `<span class="pinI">${x.type==='task' ? ICON.starFill : ICON.pinFill}</span>` : '';
  return `<li class="item ${done?'done':''}" data-id="${x.id}" data-key="${x.id}@${occ}" data-occ="${occ}" data-can="${canCheck?1:0}">
    <div class="sw-bg"><span class="sw-l">${canCheck ? ICON.check+(done?'Вернуть':'Готово') : ''}</span><span class="sw-r">${rec&&occ?'Пропустить':'Удалить'}${ICON.trash}</span></div>
    <div class="sw">${o.time ? `<span class="tcol">${x.time}</span>` : ''}${lead}
      <div class="txt"><div class="t">${pinI}${esc(title)}</div>${prev ? `<div class="b">${esc(prev.slice(0,200))}</div>` : ''}<div class="meta">${meta.join('')}</div></div>
      ${th ? `<img class="rthumb" src="${esc(th.thumb)}" alt="">` : ''}</div></li>`;
}
const list = (items, o={}, k) => `<ul class="list">${sortItems(items, k).map(x=>row(x,o)).join('')}</ul>`;
function lessonRow(l, k){
  const t = today(), now = hmNow();
  const live = k===t && l.start<=now && now<l.end, past = k<t || (k===t && l.end<=now);
  const meta = [l.kind, l.room && 'ауд. '+l.room, l.teacher].filter(Boolean).map(esc).join(' · ');
  return `<li class="lesson ${live?'live':''} ${past?'past':''}" data-lesson="${l.id}" data-key="L-${l.id}-${k}">
    <span class="tcol"><span>${l.start}</span><small>${l.end}</small></span><span class="lbar"></span>
    <div class="txt"><div class="t">${esc(l.title)}${live?'<span class="livebadge">идёт</span>':''}</div>${meta?`<div class="m">${meta}</div>`:''}</div></li>`;
}
function agenda(k){
  const t = today(), occ = itemsOn(k), les = lessonsOn(k);
  const timed = [...les.map(l => ({t:l.start, l})), ...occ.filter(x => x.time).map(x => ({t:x.time, x}))]
    .sort((a,b) => a.t<b.t ? -1 : a.t>b.t ? 1 : (a.l ? -1 : 1));
  const untimed = occ.filter(x => !x.time);
  if (!timed.length && !untimed.length) return `<div class="empty">Ничего не запланировано.<br>Нажмите +, чтобы добавить задачу.</div>`;
  let h = '';
  if (timed.length){
    const now = hmNow(); let placed = k!==t;
    h += '<ul class="list">';
    for (const e of timed){
      if (!placed && e.t > now){ h += `<li class="nowline"><span>${now}</span></li>`; placed = true; }
      h += e.l ? lessonRow(e.l, k) : row(e.x, {occ:k, time:true, folder:true, noDate:true});
    }
    if (!placed) h += `<li class="nowline"><span>${now}</span></li>`;
    h += '</ul>';
  }
  if (untimed.length) h += (timed.length ? '<div class="sub">Без времени</div>' : '') + list(untimed, {occ:k, folder:true, noDate:true}, k);
  return h;
}

  const t = today(), tm = addDays(t,1), wk = addDays(t,7), fo = st.tf==='all';
  const all = db.items.filter(x => x.type==='task' && (fo || x.folderId===st.tf));
  const g = { late:[], today:[], tom:[], week:[], later:[], nodate:[], rep:[], done:[] };
  for (const x of all){
    if (x.repeat){
      if (occursOn(x,t) && !x.doneDates.includes(t)) g.today.push(x); else g.rep.push(x);
      continue;
    }
    if (x.done){ g.done.push(x); continue; }
    if (!x.date) g.nodate.push(x);
    else if (x.date < t) g.late.push(x);
    else if (x.date===t) g.today.push(x);
    else if (x.date===tm) g.tom.push(x);
    else if (x.date<=wk) g.week.push(x);
    else g.later.push(x);
  }
  const o = { folder:fo };
  const sec = (title, arr, opt=o, extra='') => arr.length ? `<div class="sechead ${title==='Просрочено'?'warn':''}"><h2>${title}</h2>${extra || `<small>${arr.length}</small>`}</div>${list(arr, opt)}` : '';
  const openN = g.late.length+g.today.length+g.tom.length+g.week.length+g.later.length+g.nodate.length;
  let h = '';
  if (!openN) h += `<div class="allclear"><b>Невыполненных задач нет</b>Добавьте задачу в поле сверху или кнопкой +.</div>`;
  h += sec('Просрочено', g.late, o, `<button class="minibtn" id="moveLate">На сегодня · ${g.late.length}</button>`);
  h += sec('Сегодня', g.today, {...o, occ:t, noDate:true});
  h += sec('Завтра', g.tom, {...o, noDate:true});
  h += sec('На неделе', g.week);
  h += sec('Позже', g.later);
  h += sec('Без даты', g.nodate);
  h += sec('Повторяющиеся', g.rep);
  if (g.done.length){
    const d = g.done.sort((a,b) => b.updated-a.updated).slice(0,50);
    h += `<button class="togg ${st.showDone?'open':''}" id="doneTog"><h2>Выполнено · ${g.done.length}</h2><span class="arr">›</span></button>`;
    if (st.showDone) h += `<ul class="list" id="doneList">${d.map(x => row(x, o)).join('')}</ul>`;
  }
  return h;
}

/* ---------- attachments ---------- */
function drawThumb(src, w, h){
  const s = Math.min(1, 280/Math.max(w,h)), c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w*s)); c.height = Math.max(1, Math.round(h*s));
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', .72);
}
async function imageThumb(blob){
  const url = URL.createObjectURL(blob);
  try { const img = new Image(); img.src = url; await img.decode(); return { thumb: drawThumb(img, img.naturalWidth, img.naturalHeight) }; }
  catch(e){ return {}; } finally { URL.revokeObjectURL(url); }
}
function mediaInfo(blob, isVideo){
  return new Promise(res => {
    const m = document.createElement(isVideo ? 'video' : 'audio'), url = URL.createObjectURL(blob);
    let done = false;
    const fin = r => { if (done) return; done = true; URL.revokeObjectURL(url); m.removeAttribute('src'); m.load?.(); res(r); };
    m.muted = true; m.preload = 'auto'; if (isVideo){ m.playsInline = true; m.setAttribute('playsinline',''); }
    const dur = () => isFinite(m.duration) ? m.duration : 0;
    m.onloadedmetadata = () => { if (!isVideo) fin({dur:dur()}); };
    m.onloadeddata = () => { if (isVideo) m.currentTime = Math.min(.4, dur()/2 || .1); };
    m.onseeked = () => { try { fin({thumb: drawThumb(m, m.videoWidth, m.videoHeight), dur: dur()}); } catch(e){ fin({dur:dur()}); } };
    m.onerror = () => fin({});
    setTimeout(() => fin({dur:dur()}), 4000);
    m.src = url; m.load();
  });
}
function makeInfo(f, type){
  const k = kind({type, name:f.name});
  if (k==='image') return imageThumb(f);
  if (k==='video') return mediaInfo(f, true);
  if (k==='audio') return mediaInfo(f, false);
  return Promise.resolve({});
}
function pickFiles(accept, cb){
  const i = document.createElement('input'); i.type = 'file'; i.multiple = true; if (accept) i.accept = accept;
  i.style.cssText = 'position:fixed;left:-100px;top:0;opacity:0';
  i.onchange = () => { const fs = [...i.files]; i.remove(); if (fs.length) cb(fs); };
  document.body.appendChild(i); i.click();
}
function tileHTML(a){
  const k = kind(a), ext = extOf(a.name);
  let inner;
  if (a.thumb) inner = `<img src="${esc(a.thumb)}" alt="">`;
  else if (k==='audio') inner = `<span class="tic">${ICON.wave}</span>`;
  else if (k==='image' || k==='video') inner = `<span class="tic">${ICON.image}</span>`;
  else inner = `<span class="ext">${esc(ext || 'файл')}</span>`;
  return `<div class="tile k-${k} ${a.busy?'busy':''}" data-open="${a.id}" role="button" aria-label="${esc(a.name)}">${inner}
    ${k==='video' ? `<span class="play">${ICON.play}</span>` : ''}
    ${!a.thumb && k!=='video' ? `<span class="nm">${esc(k==='audio' ? a.name.replace(/\.[^.]+$/,'') : a.name)}</span>` : ''}
    ${a.dur && (k==='video'||k==='audio') ? `<span class="dur">${fmtDur(a.dur)}</span>` : ''}
    ${a.busy ? '' : `<button class="x" data-rm="${a.id}" aria-label="Убрать вложение">×</button>`}</div>`;
}
const canRec = !!(window.MediaRecorder && navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
async function startRec(onDone){
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ toast('Нет доступа к микрофону. Разрешите его, когда iPhone спросит'); return null; }
  const mime = ['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(t => MediaRecorder.isTypeSupported?.(t)) || '';
  const mr = new MediaRecorder(stream, mime ? {mimeType:mime} : undefined), chunks = [], t0 = Date.now();
  let cancelled = false;
  mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  mr.onstop = () => {
    stream.getTracks().forEach(t => t.stop());
    if (cancelled || !chunks.length) return;
    const type = (mr.mimeType || mime || 'audio/mp4').split(';')[0], d = new Date();
    onDone(new File(chunks, `Голосовая ${pad(d.getHours())}-${pad(d.getMinutes())}.${type.includes('webm')?'webm':'m4a'}`, {type}), (Date.now()-t0)/1000);
  };
  mr.start(250);
  return { t0, stop: () => { if (mr.state!=='inactive') mr.stop(); },
    cancel: () => { cancelled = true; if (mr.state!=='inactive') mr.stop(); else stream.getTracks().forEach(t => t.stop()); } };
}

let vs = null;
async function openViewer(atts, start=0){
  if (!atts.length) return;
  const vw = $('#viewer');
  const blobs = await Promise.all(atts.map(a => fget(a.id).catch(() => null)));
  const urls = [];
  const slides = atts.map((a, i) => {
    const b = blobs[i], k = kind(a);
    if (!b) return `<div class="slide"><div class="fcard"><b>Файл не найден</b><small>${esc(a.name)}</small></div></div>`;
    const u = URL.createObjectURL(b); urls.push(u);
    if (k==='image') return `<div class="slide" data-zoom><img src="${u}" alt="${esc(a.name)}"></div>`;
    if (k==='video') return `<div class="slide"><video src="${u}" controls playsinline preload="metadata" ${a.thumb?`poster="${esc(a.thumb)}"`:''}></video></div>`;
    if (k==='audio') return `<div class="slide"><div class="fcard"><span class="big">${ICON.wave}</span><b>${esc(a.name)}</b><audio src="${u}" controls preload="metadata"></audio></div></div>`;
    return `<div class="slide"><div class="fcard"><span class="bigext">${esc(extOf(a.name) || 'файл')}</span><b>${esc(a.name)}</b><small>${fmtSize(a.size)}</small><button class="vbtn" data-share>Открыть в другом приложении</button></div></div>`;
  });
  vw.innerHTML = `<div class="vbar"><button id="vClose" aria-label="Закрыть">${ICON.close}</button><span id="vCount"></span><button id="vShare" aria-label="Поделиться">${ICON.share}</button></div>
    <div class="track" id="track">${slides.join('')}</div><div class="vname" id="vName"></div>`;
  vs = { atts, blobs, urls, idx:start };
  vw.hidden = false;
  const tr = $('#track'); tr.scrollLeft = start * tr.clientWidth;
  updateViewer();
  requestAnimationFrame(() => requestAnimationFrame(() => vw.classList.add('open')));
  tr.addEventListener('scroll', () => {
    const i = Math.round(tr.scrollLeft / Math.max(1, tr.clientWidth));
    if (i!==vs.idx){ vs.idx = i; tr.querySelectorAll('video,audio').forEach(m => m.pause()); updateViewer(); }
  }, {passive:true});
  let lastTap = 0, lastTouch = 0, sx = 0, sy = 0;
  tr.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
  tr.addEventListener('touchend', e => {
    lastTouch = Date.now();
    const c = e.changedTouches[0]; if (Math.abs(c.clientX-sx) > 10 || Math.abs(c.clientY-sy) > 10) { lastTap = 0; return; }
    const s = e.target.closest('[data-zoom]'); if (!s) return;
    if (Date.now()-lastTap < 300){ toggleZoom(s, c.clientX, c.clientY); lastTap = 0; } else lastTap = Date.now();
  });
  tr.addEventListener('dblclick', e => { if (Date.now()-lastTouch < 800) return; const s = e.target.closest('[data-zoom]'); if (s) toggleZoom(s, e.clientX, e.clientY); });
  $('#vClose').onclick = closeViewer;
  $('#vShare').onclick = () => shareBlob(vs.blobs[vs.idx], vs.atts[vs.idx]);
  tr.addEventListener('click', e => { if (e.target.closest('[data-share]')) shareBlob(vs.blobs[vs.idx], vs.atts[vs.idx]); });
}
function toggleZoom(s, x, y){
  const tr = $('#track'), on = !s.classList.contains('zoom');
  const r = s.getBoundingClientRect(), fx = (x - r.left)/r.width, fy = (y - r.top)/r.height;
  s.classList.toggle('zoom', on); tr.style.overflowX = on ? 'hidden' : '';
  if (on){ s.scrollLeft = (s.scrollWidth - s.clientWidth) * fx; s.scrollTop = (s.scrollHeight - s.clientHeight) * fy; }
  const img = s.querySelector('img');
  if (img && !REDUCE) img.animate([{opacity:.6,transform:on?'scale(.6)':'scale(1.4)'},{opacity:1,transform:'none'}], {duration:300,easing:SPRING});
}
function updateViewer(){
  if (!vs) return;
  const n = vs.atts.length, a = vs.atts[vs.idx];
  $('#vCount').textContent = n > 1 ? `${vs.idx+1} / ${n}` : '';
  $('#vName').textContent = a ? a.name : '';
  $('#vShare').hidden = !vs.blobs[vs.idx];
}
function closeViewer(){
  const vw = $('#viewer'); if (!vs) return;
  const urls = vs.urls; vs = null;
  vw.querySelectorAll('video,audio').forEach(m => m.pause());
  vw.classList.remove('open');
  setTimeout(() => { vw.hidden = true; vw.innerHTML = ''; urls.forEach(u => URL.revokeObjectURL(u)); }, REDUCE ? 0 : 260);
}
async function shareBlob(blob, a){
  if (!blob) return;
  const file = new File([blob], a.name, {type: typeOf(a) || blob.type || 'application/octet-stream'});
  try { if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file]}); return; } }
  catch(e){ if (e.name==='AbortError') return; }
  const link = document.createElement('a'); link.href = URL.createObjectURL(file); link.download = a.name; link.target = '_blank';
  document.body.appendChild(link); link.click(); setTimeout(() => { URL.revokeObjectURL(link.href); link.remove(); }, 4000);
}

/* ---------- markdown editing helpers ---------- */
function mdWrap(ta, a, b=a){
  const s = ta.selectionStart, e = ta.selectionEnd, v = ta.value, sel = v.slice(s,e) || 'текст';
  ta.value = v.slice(0,s)+a+sel+b+v.slice(e);
  ta.focus(); ta.setSelectionRange(s+a.length, s+a.length+sel.length);
}
function mdLine(ta, prefix){
  const s = ta.selectionStart, v = ta.value, ls = v.lastIndexOf('\n', s-1)+1;
  const cur = v.slice(ls).match(/^(#{1,3} |\s*[-*] \[[ xX]\] |\s*[-*] |\s*\d+[.)] |> )?/)[0];
  const insert = cur===prefix ? '' : prefix;
  ta.value = v.slice(0,ls)+insert+v.slice(ls+cur.length);
  const pos = Math.max(ls, s - cur.length + insert.length);
  ta.focus(); ta.setSelectionRange(pos, pos);
}
function mdEnter(e){
  if (e.key!=='Enter' || e.shiftKey) return;
  const ta = e.target, s = ta.selectionStart, v = ta.value;
  if (s!==ta.selectionEnd) return;
  const ls = v.lastIndexOf('\n', s-1)+1, line = v.slice(ls, s);
  const m = line.match(/^(\s*)([-*] \[[ xX]\] |[-*] |(\d+)([.)]) )/);
  if (!m) return;
  e.preventDefault();
  if (line.trim()===m[2].trim()){ ta.value = v.slice(0,ls)+v.slice(s); ta.setSelectionRange(ls, ls); return; }
  const next = m[1] + (m[3] ? (+m[3]+1)+m[4]+' ' : m[2].replace(/\[[xX]\]/,'[ ]'));
  ta.value = v.slice(0,s)+'\n'+next+v.slice(s);
  ta.setSelectionRange(s+1+next.length, s+1+next.length);
}

const CRC_T = (() => { const t = new Uint32Array(256); for (let n=0;n<256;n++){ let c=n; for (let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
function crc32(u8){ let c = 0xFFFFFFFF; for (let i=0;i<u8.length;i++) c = CRC_T[(c^u8[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
async function makeZip(entries){
  const parts = [], central = [], enc = new TextEncoder(), d = new Date();
  const dt = (d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1), dd = ((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  let off = 0, cdSize = 0;
  for (const e of entries){
    const crc = crc32(new Uint8Array(await e.blob.arrayBuffer())), size = e.blob.size, nm = enc.encode(e.name);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true);
    h.setUint16(10,dt,true); h.setUint16(12,dd,true); h.setUint32(14,crc,true); h.setUint32(18,size,true); h.setUint32(22,size,true);
    h.setUint16(26,nm.length,true); h.setUint16(28,0,true);
    parts.push(h, nm, e.blob);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true); c.setUint16(10,0,true);
    c.setUint16(12,dt,true); c.setUint16(14,dd,true); c.setUint32(16,crc,true); c.setUint32(20,size,true); c.setUint32(24,size,true);
    c.setUint16(28,nm.length,true); c.setUint32(42,off,true);
    central.push(c, nm); cdSize += 46+nm.length; off += 30+nm.length+size;
  }
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true); end.setUint16(8,entries.length,true); end.setUint16(10,entries.length,true);
  end.setUint32(12,cdSize,true); end.setUint32(16,off,true);
  return new Blob([...parts, ...central, end], {type:'application/zip'});
}
async function readZip(blob){
  const tl = Math.min(blob.size, 65557), tail = new DataView(await blob.slice(blob.size-tl).arrayBuffer());
  let p = -1; for (let i=tl-22;i>=0;i--) if (tail.getUint32(i,true)===0x06054b50){ p = i; break; }
  if (p<0) throw new Error('not zip');
  const n = tail.getUint16(p+10,true), cdSize = tail.getUint32(p+12,true), cdOff = tail.getUint32(p+16,true);
  const cd = new DataView(await blob.slice(cdOff, cdOff+cdSize).arrayBuffer()), dec = new TextDecoder(), ents = {};
  let q = 0;
  for (let k=0;k<n;k++){
    if (cd.getUint32(q,true)!==0x02014b50) throw new Error('bad zip');
    const method = cd.getUint16(q+10,true), csize = cd.getUint32(q+20,true), nl = cd.getUint16(q+28,true), el = cd.getUint16(q+30,true), cl = cd.getUint16(q+32,true), lo = cd.getUint32(q+42,true);
    ents[dec.decode(new Uint8Array(cd.buffer, cd.byteOffset+q+46, nl))] = {method, csize, lo};
    q += 46+nl+el+cl;
  }
  async function get(name, type=''){
    let e = ents[name];
    if (!e){ const k = Object.keys(ents).find(k => k.endsWith('/'+name)); if (k) e = ents[k]; }
    if (!e) return null;
    const lh = new DataView(await blob.slice(e.lo, e.lo+30).arrayBuffer());
    const start = e.lo+30+lh.getUint16(26,true)+lh.getUint16(28,true), raw = blob.slice(start, start+e.csize);
    if (e.method===0) return new Blob([raw], {type});
    if (e.method===8 && window.DecompressionStream) return new Blob([await new Response(raw.stream().pipeThrough(new DecompressionStream('deflate-raw'))).blob()], {type});
    throw new Error('compressed');
  }
  return { get };
}

async function prepareExport(btn){
  if (btn.dataset.ready) return;
  btn.disabled = true; btn.textContent = 'Готовлю копию…';
  try {
    const entries = [{name:'data.json', blob:new Blob([JSON.stringify({...db, format:'planner-3'})], {type:'application/json'})}];
    for (const x of db.items) for (const a of x.atts){ const b = await fget(a.id).catch(()=>null); if (b) entries.push({name:'files/'+a.id, blob:b}); }
    const zip = await makeZip(entries), name = `planner-${today()}.zip`;
    const file = new File([zip], name, {type:'application/zip'});
    if (!btn.isConnected) return;
    btn.disabled = false; btn.dataset.ready = 1; btn.classList.add('primary');
    btn.textContent = `Поделиться копией (${fmtSize(zip.size)})`; fadeIn(btn, 0);
    btn.onclick = () => shareBlob(file, {name, type:'application/zip'});
  } catch(e){
    if (btn.isConnected){ btn.disabled = false; btn.textContent = 'Сохранить резервную копию'; }
    toast('Не получилось сделать копию: '+(e.message||'ошибка'));
  }
}
async function importFile(file){

    else { zip = await readZip(file); const j = await zip.get('data.json'); if (!j) throw 0; data = JSON.parse(await j.text()); }
  } catch(e){ toast(e && e.message==='compressed' ? 'Этот архив сжат другой программой. Выберите исходный файл копии' : 'Это не файл резервной копии планера'); return; }
  const clean = sanitize(data);
  if (!clean){ toast('В файле нет данных планера'); return; }
  const nf = clean.items.reduce((s,x) => s + x.atts.length, 0);
  openSheet(`
    <div class="sh-head"><button class="link" data-close>Отмена</button><b>Восстановление</b><span style="min-width:60px"></span></div>
    <p class="note" style="margin-top:0">В копии: ${plural(clean.folders.length,['папка','папки','папок'])}, ${plural(clean.items.length,['запись','записи','записей'])}, ${plural(nf,['вложение','вложения','вложений'])}, ${plural(clean.schedule.lessons.length,['пара','пары','пар'])} в расписании.<br>Текущие данные на этом iPhone будут заменены.</p>
    <button class="danger first" id="doImp">Заменить данные</button>`);
  $('#doImp').onclick = async () => {
    const b = $('#doImp'); b.disabled = true; b.textContent = 'Восстанавливаю…';
    try {
      await fclear();
      for (const x of clean.items){
        const keep = [];
        for (const a of x.atts){
          const blob = zip ? await zip.get('files/'+a.id, a.type).catch(()=>null) : null;
          if (blob){ await fput(a.id, blob); keep.push(a); }
        }
        x.atts = keep;
      }
      db = clean; save(); applyPrefs(); closeSheet();
      swap('fade', () => { st.folder = null; st.search = false; });

    } catch(e){ b.disabled = false; b.textContent = 'Заменить данные'; toast('Не хватило места или файл повреждён'); }
  };
}

let toastT, pend = null;
function toast(msg, opt={}){
  const t = $('#toast');
  if (pend){ const p = pend; pend = null; p.commit && p.commit(); }
  t.innerHTML = `<span>${esc(msg)}</span>${opt.undo ? '<button id="undoBtn">Отменить</button>' : ''}`;
  t.classList.add('show'); clearTimeout(toastT);
  if (opt.undo){
    pend = opt;
    $('#undoBtn').onclick = () => { const p = pend; pend = null; clearTimeout(toastT); t.classList.remove('show'); if (p) p.undo(); };
  }
  toastT = setTimeout(() => { t.classList.remove('show'); if (pend===opt){ pend = null; opt.commit && opt.commit(); } }, opt.undo ? 4500 : 2300);
}

let T = null;
view.addEventListener('touchstart', e => {
  const t = e.touches[0];
  T = { x:t.clientX, y:t.clientY, dir:null, mode:null, dx:0 };
  if ((st.folder || st.search) && t.clientX < 28) T.mode = 'edge';
  else if (e.target.closest('#calBox')) T.mode = 'cal';
  else { const row = e.target.closest('.item'); if (row && !e.target.closest('.check')){ T.mode = 'row'; T.row = row; T.el = row.querySelector('.sw'); } }
}, {passive:true});
view.addEventListener('touchmove', e => {
  if (!T || T.mode!=='row') return;
  const t = e.touches[0], dx = t.clientX - T.x, dy = t.clientY - T.y;
  if (!T.dir){ if (Math.abs(dx) > 8 || Math.abs(dy) > 8) T.dir = Math.abs(dx) > Math.abs(dy)*1.2 ? 'h' : 'v'; else return; }
  if (T.dir!=='h') return;
  let d = dx;
  if (d > 0 && T.row.dataset.can!=='1') d = d*.15;
  if (Math.abs(d) > 120) d = Math.sign(d)*(120 + (Math.abs(d)-120)*.35);
  T.dx = d; T.el.style.transition = 'none'; T.el.style.transform = `translateX(${d}px)`;
  T.row.classList.toggle('sw-right', d > 0); T.row.classList.toggle('sw-left', d < 0);
  T.row.classList.toggle('armed', Math.abs(d) > 90);
}, {passive:true});
view.addEventListener('touchend', e => {
  if (!T) return; const s = T; T = null;
  const c = e.changedTouches[0], dx = c.clientX - s.x, dy = c.clientY - s.y;
  if (s.mode==='edge'){ if (dx > 60 && Math.abs(dx) > Math.abs(dy)*1.5) swap('pop', () => { if (st.search) st.search = false; else st.folder = null; }); return; }
  if (s.mode==='cal'){ if (Math.abs(dx) >= 60 && Math.abs(dx) > Math.abs(dy)*1.5) setMonth(new Date(st.month.getFullYear(), st.month.getMonth()+(dx<0?1:-1), 1), dx<0?1:-1); return; }
  if (s.mode!=='row' || s.dir!=='h') return;
  suppressClick = Date.now();
  const row = s.row, el = s.el, x = db.items.find(i => i.id===row.dataset.id), occ = row.dataset.occ;
  el.style.transition = 'transform .38s cubic-bezier(.32,.72,0,1)';
  const reset = () => { el.style.transform = ''; setTimeout(() => row.classList.remove('sw-right','sw-left','armed'), 380); };
  if (!x){ reset(); return; }
  if (s.dx > 90 && row.dataset.can==='1'){
    reset();
    const ck = row.querySelector('[data-check]');
    toggleDone(x, ck ? ck.dataset.occ : occ);
    setTimeout(refresh, REDUCE ? 0 : 300);
  } else if (s.dx < -90){
    el.style.transform = 'translateX(-105%)';
    setTimeout(() => { if (x.repeat && occ) skipOcc(x, occ); else deleteItem(x); }, REDUCE ? 0 : 220);
  } else reset();
});

  const t = b.dataset.tab;
  if (st.search){ swap('fade', () => { st.search = false; st.tab = t; }); return; }
  if (st.tab===t){ if (t==='folders' && st.folder) swap('pop', () => { st.folder = null; }); else view.scrollTo({top:0, behavior:REDUCE?'auto':'smooth'}); return; }
  swap('fade', () => { st.tab = t; });
}));
$('#back').onclick = () => swap('pop', () => { if (st.search) st.search = false; else st.folder = null; });
$('#searchBtn').onclick = () => { swap('push', () => { st.search = true; st.q = ''; }); $('#q')?.focus(); };
$('#action').onclick = () => { if (st.search) return; if (st.tab==='folders' && st.folder) editFolder(folderById(st.folder)); else settings(); };
$('#fab').onclick = () => {
  if (st.tab==='tasks') editItem({ type:'task', folderId: st.tf!=='all' && folderById(st.tf) ? st.tf : ensureFolder() });
  else if (st.tab==='cal') editItem({ type:'task', date:st.sel, folderId:ensureFolder() });
  else if (st.folder) editItem({ type: st.filter==='note' ? 'note' : 'task', folderId:st.folder });
  else editFolder({});
};
document.addEventListener('keydown', e => { if (e.key==='Escape'){ if (vs) closeViewer(); else closeSheet(); } });

/* ---------- init ---------- */
document.querySelector('[data-tab="tasks"]').innerHTML = ICON.tasks+'Задачи';
document.querySelector('[data-tab="cal"]').innerHTML = ICON.cal+'Календарь';
document.querySelector('[data-tab="folders"]').innerHTML = ICON.folder+'Папки';
$('#fab').innerHTML = ICON.plus;
$('#searchBtn').innerHTML = ICON.search;
loadDb().then(d => {
  db = d; applyPrefs(); save(); render(); fadeIn(view, 8);
  setTimeout(cleanupFiles, 1500);
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden || !db) return;
  if (today()!==lastToday){ lastToday = today(); st.sel = today(); render(); }
  else if (st.tab==='tasks' && !st.search) refresh();
});
setInterval(() => { if (db && !document.hidden && st.tab==='tasks' && !st.search && $('#sheetWrap').hidden) refresh(); }, 60000);
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
if ('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
